name: 全市场雷达每日扫描 (P1)

"on":
  workflow_dispatch:        # 手动触发（首次全量 / 补扫）
    inputs:
      # ★ R526: 「当日已扫描」守卫会把同一天的所有 dispatch 全部跳过 —— 这在正常情况下
      #   是对的（防双扫/堆积），但**修复了扫描逻辑之后就无法当天验证**（必须等到次日）。
      #   本轮实证需要它：10-08 的产物是**修复前**口径（n_signal=17，全部 fresh=10），
      #   不补扫就看不到新口径的效果。故加显式 force 开关，只越过"当日已扫过"判定，
      #   **周末守卫与盘后时间窗守卫仍然生效**（它们防的是"扫出来的数据本身不对"）。
      force:
        description: '强制全量重扫(忽略"当日已扫过"守卫; 用于修复后补扫/产物损坏复核)'
        type: boolean
        default: false
  schedule:
    # 交易日 北京 18:35 (UTC 10:35)：当日收盘 K 线此时已由源端完整发布(收盘后1~2小时)，
    # 全量扫描约 20~60 分钟, 完成后 push 触发 deploy.yml 发布(radar.html/radar.json + 首页信号条)。
    # 周末(A股休市)不跑——休市日数据不变, 无需重扫; 调休补班日不开市由下方交易日判断兜底。
    - cron: '35 10 * * 1-5'

# contents: write 用于提交 radar/radar.json
# R519: actions: write 用于提交后**显式**触发 deploy.yml 重新发布 Pages ——
#   原因: 本 workflow 用默认 GITHUB_TOKEN push, 而 GitHub 规定「用 GITHUB_TOKEN 执行
#   的任务所触发的事件不会创建新的 workflow run」⇒ push radar.json **不会**拉起 deploy.yml。
#   历史上靠 cron-job.org 每半小时 dispatch deploy 「顺带」发布最新 radar.json 兜着,
#   但当日扫描若晚于最后一个 deploy 时点(北京 21:30)完成, 就**无人发布** ⇒ 雷达界面
#   停在昨日。R519 实测(2026-09-23): 扫描 20:13 启动、约 22:00 完成, 全线错过时点。
permissions:
  contents: write
  actions: write

# P1b: 由 deploy 每半小时 dispatch 触发(与主看板同节奏) —— 必须串行不可 cancel!
# 若 cancel-in-progress:true, 16:30 的 dispatch 会把 16:00 起已跑 25 分钟的全量扫描
# 直接掐断(全量约 40 分钟), 下一个 run 守卫仍见"昨日数据"又全量重扫 -> 永远扫不完。
# 默认(无 cancel-in-progress)= 新 run 排队等待旧 run 完成, 全量期间堆积的 run 依次
# 执行守卫后秒退(skip), 保证"当日仅一次真扫"。
concurrency:
  group: radar-scan

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v7

      - name: 当日已扫描守卫(同链路多时点触发只真扫一次)
        id: guard
        # 注意: step 内 exit 0 只结束本 step, 后续 steps 仍会执行!
        # 必须用 GITHUB_OUTPUT 写 skip 标记 + 后续步骤 if: steps.guard.outputs.skip != 'true' 才能真正跳过扫描。
        run: |
          set -euo pipefail
          FORCE="${{ github.event.inputs.force }}"
          TODAY=$(TZ=Asia/Shanghai date +%F)
          DOW=$(TZ=Asia/Shanghai date +%u)     # 1=周一..7=周日
          HH=$(TZ=Asia/Shanghai date +%H)
          if [ "$DOW" -ge 6 ]; then
            echo "周末($DOW)休市, 数据不变, 跳过扫描"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$HH" -lt 15 ] || [ "$HH" -ge 23 ]; then
            echo "当前北京 $HH 时不在盘后窗口(15~22时), 跳过(避免白天代码push误触发全量)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -f radar/radar.json ]; then
            # R397: 本地 radar.json 解析加容错(R337 冲突 marker 事故同款损坏态) —— 原裸
            # python 解析在文件损坏时 rc!=0, 被 set -euo pipefail 终止 guard step, 后续
            # scan/自检/提交全被跳过 -> 损坏的 radar.json 无法经正常重扫自愈(唯一修复通道
            # 被自身阻断, job 只红叉不产新数据)。与下方 L66 远端解析(R374 已带 2>/dev/null
            # || echo "")不对称, 现对齐: 解析失败 BD="" != TODAY -> 自然放行全量重扫,
            # scan_radar 新产物覆盖损坏文件完成自愈。
            # R422: 补 encoding="utf-8" —— 与同文件 L95/L121 一致。原缺省依赖 runner 的
            # locale(getpreferredencoding), LC_ALL=C 等非 UTF-8 环境下读含中文的 radar.json
            # 会抛 UnicodeDecodeError; 虽被 2>/dev/null 兜成 BD="" 不致报错, 但会让"当日已扫
            # 过"守卫**恒判非今日** → 每个 dispatch 都放行全量重扫(20~60min, 与 R374 修掉的
            # 双扫/堆积同型后果)。radar.json 恒为 UTF-8, 显式声明即可免疫 locale。
            BD=$(python3 -c "import json;print(json.load(open('radar/radar.json',encoding='utf-8'))['meta'].get('build_time','')[:10])" 2>/dev/null || echo "")
            echo "radar build_date=$BD  北京今天=$TODAY"
            if [ "$BD" = "$TODAY" ] && [ "$FORCE" = "true" ]; then
              echo "★ force=true: 本地产物虽是今日($BD), 仍强制全量重扫"
            elif [ "$BD" = "$TODAY" ]; then
              # ★ R526 修⑤: 「产物性 skip」前必须先复核**将要被沿用的那份产物**是否健康 ——
              #   否则坏产物当天会被永久静默沿用: skip 会让「产物自检」步骤一并被跳过，
              #   门禁整条失效而 job 仍报 success（实证 run 37776091490：head=594411f、
              #   无 force ⇒ 步骤 4~8 **全部 skipped** ⇒ success；而当天产物 n_signal=17
              #   按新门禁 >=50 本应失败，且 meta.fresh_max 缺失）。
              #   不健康 ⇒ **放弃跳过**、放行全量重扫自愈（规则 98: 兜底/自愈须落云端）。
              if python3 radar/check_artifact.py; then
                echo "今日(北京 $TODAY)已完成扫描并入库, 本次 dispatch 跳过(数据已当日)"
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              else
                echo "★★ 本地产物健康自检**不通过** ⇒ 放弃跳过, 放行全量重扫以自愈(断言消息见上)"
                _HEAL=1
              fi
            fi
            # ★ R526 修⑤: 上面不健康时会 **fall through 到这里**放行扫描 —— 此时 BD 恰恰
            #   是**今日**，原措辞恒写"非今日"会与实际不符（规则 84/107: 披露文案本身也是
            #   被审计对象，必须与事实一致）。
            if [ "${_HEAL:-0}" = "1" ]; then
              echo "radar 数据为 $BD(今日)但健康自检不通过 ⇒ 执行全量扫描以覆盖退化产物"
            else
              echo "radar 数据为 $BD(非今日), 执行全量扫描以补当日数据"
            fi
          else
            echo "radar/radar.json 不存在, 执行全量扫描"
          fi
          # R374 竞态补查(09-08 实证双扫): concurrency 排队让次发在首发 commit 后启动,
          # 但 actions/checkout 若早于首发 push 完成则拿到旧 main(build_date=昨) → 守卫
          # 误放行致同链路双全量扫描(两发各跑 ~60min, 第二版覆盖第一版)。守卫内主动
          # fetch 远端 main 再查一次: 远端已含今日产物即跳过(消除 checkout 时间差)。
          git fetch origin main -q 2>/dev/null || true
          RBD=$(git show FETCH_HEAD:radar/radar.json 2>/dev/null | python3 -c "import json,sys;print(json.load(sys.stdin)['meta'].get('build_time','')[:10])" 2>/dev/null || echo "")
          echo "远端 main radar build_date=$RBD"
          if [ "$RBD" = "$TODAY" ] && [ "$FORCE" != "true" ]; then
            # ★ R526 修⑤: 同上，这里要核的是**远端那份**产物。取到临时目录后用
            #   **同一个** check_artifact.py 复核（该脚本读 cwd 相对路径 radar/radar.json，
            #   故无需参数化 = 断言体零改动，规则 20 单一来源）。
            rm -rf .radar_health && mkdir -p .radar_health/radar
            _RH_OK=0
            if git show FETCH_HEAD:radar/radar.json > .radar_health/radar/radar.json 2>/dev/null \
               && ( cd .radar_health && python3 "$GITHUB_WORKSPACE/radar/check_artifact.py" ); then
              _RH_OK=1
            fi
            rm -rf .radar_health
            if [ "$_RH_OK" = "1" ]; then
              echo "远端 main 已有今日产物(首发已提交), 本次 dispatch 跳过(防竞态双扫)"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "★★ 远端 main 今日产物健康自检**不通过** ⇒ 放弃跳过, 放行全量重扫以自愈"
          fi

      - name: 配置 Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: 全市场缠论扫描(腾讯qfq主源/新浪兜底, 自动限速与WAF退避)
        if: steps.guard.outputs.skip != 'true'
        # ★ R526: scan_radar 内部还有第二层当日短路（「数据已覆盖市场末交易日 ⇒ 跳过
        #   全量重扫」）—— 只在 workflow 层放行是不够的（实测 force 派发仍 6 秒短路退出）。
        #   故把 force 透传给它；定时跑(无 inputs)时为空串 ⇒ 行为不变。
        env:
          RADAR_FORCE: ${{ github.event.inputs.force }}
        run: python3 radar/scan_radar.py

      - name: 产物自检(不达标即失败, 保留上一版 radar.json)
        if: steps.guard.outputs.skip != 'true'
        # ★ R526: 断言体已抽为 radar/check_artifact.py（**唯一来源**，规则 20）——
        #   因为守卫的「产物性 skip」出口也要复核**将要被沿用的那份产物**。
        #   抽取经 diff 自证与内联版本**逐字节一致**，本步骤行为不变。
        run: python3 radar/check_artifact.py

      - name: 提交雷达数据(触发 deploy 发布)
        id: commit
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          if git diff --quiet radar/radar.json && git diff --quiet radar/marks.json; then
            echo "radar.json/marks.json 无变化(休市/扫描结果同昨), 跳过提交"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # R337 事故(09-07 03a070f): 原 `pull --rebase --autostash || true` 在远端有
          # 新提交时 rebase 冲突被 || true 吞掉, 未检测冲突标记就 git add+commit,
          # 把 <<<<<<< 冲突标记提交进 main(radar.json/marks.json 头部带标记 → 线上
          # JSON.parse 崩、雷达页白屏)。修复 = 三道防线:
          #   ① 先落本地 commit 再 rebase(无 autostash 场景, 提交内容自包含)
          #   ② rebase 用 -X theirs 自动解决 json 冲突(取本地产物=当日新扫描数据,
          #      与 R 系列裁决"更晚 build_time 为准、保留本地产物"一致)
          #   ③ rebase 失败立即 abort 退出, 绝不在冲突标记残留状态下继续提交
          # push 被拒(远端前进)时循环 rebase 重试, 不 force。
          ASOF=$(python3 -c 'import json;print(json.load(open("radar/radar.json",encoding="utf-8"))["meta"]["asof"])')
          git add radar/radar.json radar/marks.json
          git commit -m "chore: 全市场缠论雷达数据刷新 asof=${ASOF}" || { echo "commit 失败(无变更?)"; exit 1; }
          for i in 1 2 3; do
            if git push origin "${GITHUB_REF_NAME}" 2>/tmp/radar_push_err; then
              echo "已提交并推送雷达数据 asof=${ASOF}"
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push 第 ${i} 次被拒(远端有新提交), rebase 后重试..."
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" || {
              echo "!! rebase 冲突且自动解决失败, 中止(保留现场, 勿带冲突标记提交)"
              git rebase --abort 2>/dev/null || true
              exit 1
            }
          done
          echo "!! 连续 3 次 push 失败:"; tail -3 /tmp/radar_push_err; exit 1

      - name: 显式触发 Pages 重新发布(R519)
        # 为什么需要这一步: 上一步用默认 GITHUB_TOKEN push, 而 GitHub 规定
        #   「用 GITHUB_TOKEN 执行的任务所触发的事件不会创建新的 workflow run」
        # ⇒ push radar.json **不会**拉起 deploy.yml。历史链路靠 cron-job.org 每半小时
        #   dispatch deploy 顺带发布最新 radar.json; 一旦当日扫描晚于最后一个 deploy
        #   时点(北京 21:30)完成, 就无人发布 —— 数据已入库但界面停在昨日。
        #   本步用 gh workflow run 显式拉起 deploy(与 freshness-watchdog R240 自救同款机制,
        #   2026-08-28 已实测: GITHUB_TOKEN + actions:write 可成功 dispatch)。
        # 不会死循环: deploy 末尾虽会 dispatch radar-scan, 但那时本日已扫完 ⇒ 守卫 skip
        #   ⇒ step7/本步均被 if 拦下, 不再触发 deploy。
        if: steps.guard.outputs.skip != 'true' && steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
          echo "已触发 deploy.yml: radar.json 入库后需重新发布 Pages 才会生效"
