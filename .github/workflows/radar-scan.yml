name: 全市场雷达每日扫描 (P1)

"on":
  workflow_dispatch:        # 手动触发（首次全量 / 补扫）
  schedule:
    # 交易日 北京 18:35 (UTC 10:35)：当日收盘 K 线此时已由源端完整发布(收盘后1~2小时)，
    # 全量扫描约 20~60 分钟, 完成后 push 触发 deploy.yml 发布(radar.html/radar.json + 首页信号条)。
    # 周末(A股休市)不跑——休市日数据不变, 无需重扫; 调休补班日不开市由下方交易日判断兜底。
    - cron: '35 10 * * 1-5'

# contents: write 用于提交 radar/radar.json
permissions:
  contents: write

# P1b: 由 deploy 每半小时 dispatch 触发(与主看板同节奏) —— 必须串行不可 cancel!
# 若 cancel-in-progress:true, 16:30 的 dispatch 会把 16:00 起已跑 25 分钟的全量扫描
# 直接掐断(全量约 40 分钟), 下一个 run 守卫仍见"昨日数据"又全量重扫 -> 永远扫不完。
# 默认(无 cancel-in-progress)= 新 run 排队等待旧 run 完成, 全量期间堆积的 run 依次
# 执行守卫后秒退(skip), 保证"当日仅一次真扫"。
concurrency:
  group: radar-scan

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v7

      - name: 当日已扫描守卫(同链路多时点触发只真扫一次)
        id: guard
        # 注意: step 内 exit 0 只结束本 step, 后续 steps 仍会执行!
        # 必须用 GITHUB_OUTPUT 写 skip 标记 + 后续步骤 if: steps.guard.outputs.skip != 'true' 才能真正跳过扫描。
        run: |
          set -euo pipefail
          TODAY=$(TZ=Asia/Shanghai date +%F)
          DOW=$(TZ=Asia/Shanghai date +%u)     # 1=周一..7=周日
          HH=$(TZ=Asia/Shanghai date +%H)
          if [ "$DOW" -ge 6 ]; then
            echo "周末($DOW)休市, 数据不变, 跳过扫描"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$HH" -lt 15 ] || [ "$HH" -ge 23 ]; then
            echo "当前北京 $HH 时不在盘后窗口(15~22时), 跳过(避免白天代码push误触发全量)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -f radar/radar.json ]; then
            BD=$(python3 -c "import json;print(json.load(open('radar/radar.json'))['meta'].get('build_time','')[:10])")
            echo "radar build_date=$BD  北京今天=$TODAY"
            if [ "$BD" = "$TODAY" ]; then
              echo "今日(北京 $TODAY)已完成扫描并入库, 本次 dispatch 跳过(数据已当日)"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "radar 数据为 $BD(非今日), 执行全量扫描以补当日数据"
          else
            echo "radar/radar.json 不存在, 执行全量扫描"
          fi
          # R374 竞态补查(09-08 实证双扫): concurrency 排队让次发在首发 commit 后启动,
          # 但 actions/checkout 若早于首发 push 完成则拿到旧 main(build_date=昨) → 守卫
          # 误放行致同链路双全量扫描(两发各跑 ~60min, 第二版覆盖第一版)。守卫内主动
          # fetch 远端 main 再查一次: 远端已含今日产物即跳过(消除 checkout 时间差)。
          git fetch origin main -q 2>/dev/null || true
          RBD=$(git show FETCH_HEAD:radar/radar.json 2>/dev/null | python3 -c "import json,sys;print(json.load(sys.stdin)['meta'].get('build_time','')[:10])" 2>/dev/null || echo "")
          echo "远端 main radar build_date=$RBD"
          if [ "$RBD" = "$TODAY" ]; then
            echo "远端 main 已有今日产物(首发已提交), 本次 dispatch 跳过(防竞态双扫)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

      - name: 配置 Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: 全市场缠论扫描(腾讯qfq主源/新浪兜底, 自动限速与WAF退避)
        if: steps.guard.outputs.skip != 'true'
        run: python3 radar/scan_radar.py

      - name: 产物自检(不达标即失败, 保留上一版 radar.json)
        if: steps.guard.outputs.skip != 'true'
        run: |
          python3 - <<'PY'
          import json, datetime
          d = json.load(open("radar/radar.json", encoding="utf-8"))
          m = d["meta"]
          assert m["n_ok"] > 4000, "有效分析过少: %s" % m["n_ok"]
          assert m["n_signal"] >= 0
          print("自检通过: 有效%d 信号%d asof=%s" % (m["n_ok"], m["n_signal"], m["asof"]))
          PY

      - name: 提交雷达数据(触发 deploy 发布)
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          if git diff --quiet radar/radar.json && git diff --quiet radar/marks.json; then
            echo "radar.json/marks.json 无变化(休市/扫描结果同昨), 跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # R337 事故(09-07 03a070f): 原 `pull --rebase --autostash || true` 在远端有
          # 新提交时 rebase 冲突被 || true 吞掉, 未检测冲突标记就 git add+commit,
          # 把 <<<<<<< 冲突标记提交进 main(radar.json/marks.json 头部带标记 → 线上
          # JSON.parse 崩、雷达页白屏)。修复 = 三道防线:
          #   ① 先落本地 commit 再 rebase(无 autostash 场景, 提交内容自包含)
          #   ② rebase 用 -X theirs 自动解决 json 冲突(取本地产物=当日新扫描数据,
          #      与 R 系列裁决"更晚 build_time 为准、保留本地产物"一致)
          #   ③ rebase 失败立即 abort 退出, 绝不在冲突标记残留状态下继续提交
          # push 被拒(远端前进)时循环 rebase 重试, 不 force。
          ASOF=$(python3 -c 'import json;print(json.load(open("radar/radar.json",encoding="utf-8"))["meta"]["asof"])')
          git add radar/radar.json radar/marks.json
          git commit -m "chore: 全市场缠论雷达数据刷新 asof=${ASOF}" || { echo "commit 失败(无变更?)"; exit 1; }
          for i in 1 2 3; do
            if git push origin "${GITHUB_REF_NAME}" 2>/tmp/radar_push_err; then
              echo "已提交并推送雷达数据 asof=${ASOF}"
              exit 0
            fi
            echo "push 第 ${i} 次被拒(远端有新提交), rebase 后重试..."
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" || {
              echo "!! rebase 冲突且自动解决失败, 中止(保留现场, 勿带冲突标记提交)"
              git rebase --abort 2>/dev/null || true
              exit 1
            }
          done
          echo "!! 连续 3 次 push 失败:"; tail -3 /tmp/radar_push_err; exit 1
