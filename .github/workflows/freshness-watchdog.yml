name: 数据新鲜度看门狗

# R237：把"云端数据没更新"从【靠旭总肉眼发现 → 来反馈 → 我再修】
# 改成【自动巡检 → 自动补救 → 自动告警】。这是终结"同一问题反复折腾"的最后一块拼图。
#
# 它做什么：
#   1. 取源端最新交易日（腾讯 gtimg 上证日线末根，海外 CI 实测可达，见 R232）
#   2. 取线上已部署报告的「数据区间」截止日（带时间戳参数绕开 Pages CDN 边缘缓存，见 R229）
#   3. 线上 < 源端  ->  说明当天数据没更新成功：
#        a) 自动触发 deploy.yml 重新部署一次（自救）
#        b) 以失败结束本 workflow -> GitHub 发邮件/在 Actions 显示红叉告警
#   4. 线上 >= 源端 -> 正常结束（退出 0）
#
# 为何不会误报：不依赖节假日日历。节假日源端不前进、线上也不前进，两者始终相等；
# 只有"源端已有新交易日、线上却停在旧日期"才判落后 —— 这正是我们真正要抓的情况。
#
# 补救/告警不保证一定成功（GitHub 自身可能故障），但它把"沉默失败"变成了"响亮失败"：
# 出问题你会被主动通知，而不是自己发现后再来追问一轮。

"on":
  schedule:
    # 北京 23:30 与 次日 02:00 各一次（UTC 15:30 / 18:00）。
    #
    # 为什么不是原来的北京 21:00/23:30（R241 实测后调整）：
    #   2026-08-28 实测时间线（UTC）——部署 #232 定时触发落 21:45:56，
    #   看门狗 #3/#4 分别落 22:51:52 / 23:48:04，仅比部署晚 66 分钟与 122 分钟。
    #   而两个看门狗自身的延迟分别是 9.87h 与 8.30h（抖动约 1.5h），
    #   部署侧延迟也观测到 8~10.5h 不等 —— 抖动叠加下存在"巡检早于部署落地"的窗口，
    #   那会把"部署还没跑"误判成"跑失败"，发出误报邮件（误报比漏报更伤，会毁掉告警可信度）。
    #
    # 调整思路：把巡检名义时间整体后移，拉开与部署窗口的距离。
    #   部署盘后落点名义最晚 = 北京 20:00，观测最大延迟约 11h -> 最坏落在北京次日 07:00。
    #   巡检取名义 23:30 / 02:00，观测最小延迟约 8h -> 最早落在北京 07:30 / 10:00。
    #   最坏情况下仍留有 >=30 分钟余量，常规情况下有 3~6 小时，足以避免误报。
    # 两个点互为冗余：GitHub schedule 是 best-effort，会延迟甚至漏跑（见 R234/R235）。
    - cron: '30 15 * * 1-5'
    - cron: '0 18 * * 1-5'
  workflow_dispatch:      # 手动触发（Actions 页面 → 本工作流 → Run workflow）
  # R240 现场验证已完成并移除临时 push 触发(结论见下)。
  # R239 现场验证已完成并移除临时 push 触发:
  # 2026-08-28 20:10(北京) 借临时 push 触发实跑一次, 8 秒完成, conclusion=success,
  # 证明看门狗能真正执行并正确判定"行情与情绪均已最新"(落后则会 exit 1 告警)。
  # 恢复为仅定时 + 手动触发, 避免每次 push 都跑一遍无谓巡检。

permissions:
  contents: read
  actions: write          # 落后时用于触发 deploy.yml 自救

concurrency:
  group: freshness-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v7

      - name: 配置 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: 巡检线上数据新鲜度
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          # 退出码: 0=已最新; 1=落后(脚本内已尝试自动触发重新部署)
          # 不用 set -e —— 需要捕获退出码后再决定是否以失败结束本 job
          python check_freshness.py
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::线上数据落后于源端最新交易日。已尝试自动触发重新部署，请查看 deploy 工作流结果；若仍落后请人工介入。"
            exit 1
          fi
          echo "✅ 线上数据已是最新，无需处理"

      # R240 实测结论(2026-08-28 20:19 北京): 自救触发链路**可用**, 验证后已移除临时步骤。
      # 证据链: 看门狗 #2 于 12:19:43Z 启动 → 9 秒后(12:19:52Z)出现 Deploy #231,
      #   其触发方式为 workflow_dispatch 且 conclusion=success ——
      #   即 gh workflow run deploy.yml 用 GITHUB_TOKEN 成功拉起了重新部署。
      #   (同时段 push 触发的 Deploy #230 被 concurrency cancel-in-progress 取消,
      #    由 #231 接管完成全量部署, 最终结果不受影响。)
      # 结论: 数据落后时, 看门狗会先自动重试部署, 再以失败结束本 job 发出告警。
