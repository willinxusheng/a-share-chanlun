name: Deploy A股缠论看板

"on":
  push:
    branches: [main]
  workflow_dispatch:        # 手动触发（Actions 页面 → Run workflow）
  schedule:
    # —— 云端定时任务（跑在 GitHub 服务器，不依赖用户电脑 / WorkBuddy）——
    # 美股 runner 使用 UTC。北京时间 16:30 = UTC 08:30，北京时间 17:00 = UTC 09:00，
    # 两个时间点互为冗余，任一触发即可完成当日盘后数据抓取与发布；
    # GitHub 定时任务为 best-effort，偶有延迟/漏跑（已实测 2026-08-17 20:22 窗口 5 分钟内未触发），
    # 故另设外部调度(cron-job.org 调 GitHub API)作可靠主触发。WorkBuddy 自动化仅在电脑开机时生效，出差不依赖它。
    - cron: '30 8 * * 1-6'
    - cron: '0 9 * * 1-6'

# 部署 Pages 需要 pages/id-token 写权限；
# contents: write 用于提交每日构建时间戳，保持仓库活跃，防止 GitHub 停用定时任务。
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 抓取行情 + 生成报告（带重试）
        run: |
          for i in 1 2 3; do
            python fetch_data.py && break || sleep 30
          done
          python report.py
          cp report.html index.html

      - name: 提交每日构建时间戳（keep-alive，防定时任务被停用）
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > last_build.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_build.txt
          git commit -m "chore: daily build [skip ci]" || echo "no changes"
          git push || echo "push skipped"

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 部署到 GitHub Pages
        uses: actions/deploy-pages@v4
