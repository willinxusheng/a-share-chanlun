name: Deploy A股缠论看板

"on":
  push:
    branches: [main]
  workflow_dispatch:        # 手动触发（Actions 页面 → Run workflow）
  schedule:
    # —— 云端定时任务（跑在 GitHub 服务器，完全不依赖用户电脑 / WorkBuddy）——
    # R235「间隔覆盖」加密定时 —— 出差不带电脑也能每日更新（取代 R234 的"猜延迟"补偿 cron）。
    #
    # 问题：GitHub schedule 是 best-effort，本仓库实测被排队挤压延迟 10.5 小时以上、甚至整天漏跑
    #       （08-27 的 08:30/09:00 UTC 实际 19:10/19:19 才跑；08-28 两个 cron 全天未触发），
    #       而 WorkBuddy 自动化需要本机开着才生效 —— 出差/关机时云端就没人触发了。
    #
    # 思路：不去猜"延迟会是几小时"（那只能赌已观测的 ~10.5h 这一次数值，规律一变就失效），
    #       改用【间隔覆盖】从根本上免疫延迟：
    #         每 4 小时一个 cron（00/04/08/12/16/20 UTC），共 6 个/天。
    #         设 GitHub 整体延迟为 d（对同一仓库的各 cron 近似相同），
    #         则实际落点仍是彼此间隔 4 小时的 6 个点（只是整体平移 d）。
    #         盘后窗口 = 北京 15:00~20:00，宽 5 小时。
    #         ∵ 落点间隔 4h ≤ 窗口宽度 5h，
    #         ∴ 任意延迟 d 下，必定有至少一次落点落在该窗口内 → 必定抓到当日收盘数据并发布。
    #       这是数学保证，与延迟大小无关，也不依赖任何本机/第三方服务。
    #
    # 成本：仓库为 public，GitHub Actions 对公开仓库免费且不限时长，6 次/天 ≈ 24 分钟/天，成本为零。
    #       提交噪声由下方 keep-alive 步骤的"每日仅一次"守卫压制（详见该步骤注释）。
    # 周一~周五（A股交易日）；周末不跑，避免无谓构建。
    - cron: '0 0 * * 1-5'
    - cron: '0 4 * * 1-5'
    - cron: '0 8 * * 1-5'
    - cron: '0 12 * * 1-5'
    - cron: '0 16 * * 1-5'
    - cron: '0 20 * * 1-5'
    # R235b：把旭总熟悉的 16:30 / 17:00 北京（UTC 08:30 / 09:00）加回来。
    # 理由：上面 6 个整点里，落在盘后窗口的只有北京 16:00（UTC 08:00）这一个；
    #       而腾讯源端通常收盘（15:00）后 1~2 小时（约北京 16:00~17:00）才更新完整日线 ——
    #       准点（d≈0）时 16:00 可能偏早、抓不到当日数据，要等到下一个落点 20:00 才新鲜。
    #       补回 16:30/17:00 后，准点情况下当日数据在 17:00 前后即可上线。
    #       这两点只增加覆盖，不破坏间隔保证（6 个整点已数学保证任意延迟下必有落点命中盘后窗口）。
    #       相邻间隔 30 分钟 > 单次构建约 4 分钟，不会互相取消（concurrency cancel-in-progress）。
    - cron: '30 8 * * 1-5'
    - cron: '0 9 * * 1-5'

# 部署 Pages 需要 pages/id-token 写权限；
# contents: write 用于提交每日构建时间戳，保持仓库活跃，防止 GitHub 停用定时任务。
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v7

      - name: 配置 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: 恢复上次成功的行情数据（让"抓取失败兜底"真正可用）
        # R238 修掉一个潜伏的"假兜底"：data.json 被 .gitignore 且从不入库，
        # 所以下面 R228 那条「抓取失败 -> 用仓库已提交的 data.json 兜底继续部署」
        # **永远不可能生效**（仓库里根本没有该文件）→ 抓取一旦连续失败就直接 exit 1
        # 中止发布，连情绪板块也跟着不更新。
        # 改用 Actions 缓存跨运行保留上次成功的 data.json（约 1MB）：
        # 既不破坏"data 不入库"的纪律，又让兜底名副其实。
        # 键含 run_id：每次成功运行都能写入一份新缓存；restore-keys 前缀匹配取最近一份。
        uses: actions/cache@v4
        with:
          path: data.json
          key: chanlun-data-${{ github.run_id }}
          restore-keys: |
            chanlun-data-

      - name: 抓取行情 + 生成报告（带重试）
        run: |
          set -euo pipefail
          ok=0
          for i in 1 2 3; do
            if python fetch_data.py; then ok=1; break; fi
            echo "fetch attempt $i failed, retry in 30s"; sleep 30
          done
          if [ "$ok" -ne 1 ]; then
            # R228: 行情源(东财)在 CI 偶发失败不应阻断发布——否则连只改展示层的提交
            # (如 R227 改"生成时间"标注)都会被卡住不上线。改用仓库已提交的 data.json
            # (上次成功抓取产物, 非脏数据) 兜底继续部署, 仅行情降级至上一成功交易日;
            # 仅当仓库根本无 data.json(首次/损坏)才真正中止, 保留脏数据防护。
            if [ -s data.json ]; then
              # R238: 措辞更正 —— data.json 并不入库, 这里用的是上一步缓存恢复的上次成功抓取产物
              echo "WARN: 行情抓取连续 3 次失败, 用缓存恢复的上次成功 data.json 兜底继续部署(行情降级至上一成功交易日, 情绪等其余部分仍照常更新)"
            else
              echo "ERROR: 行情抓取失败且无可用 data.json, 中止发布"
              exit 1
            fi
          fi
          python gen_quality_cert.py
          # R177b: 情绪指数必须在 report.py 之前重算——fetch_data 已刷新 4 个情绪 txt
          # (东财源, 含成交额/换手率, 数据截至当日), 先跑 calc_v2 使情绪板块 asof 与行情同步;
          # 失败不阻断(已提交兜底 sentiment_v2.json 仍生效, report 读旧值但板块不崩)。
          # R230: 情绪源(东财)在云端 CI 被限流会静默回退到已提交旧快照并部署, 导致线上情绪数据永久滞后。
          # 修复: (1) update_sentiment_txts 已写 sentinel sentiment/.em_fresh(1=东财可达/0=全失败);
          #       (2) 全失败时跳过 calc_v2, 直接部署已提交的本地刷新快照(带醒目 WARN);
          #       (3) 跑 calc_v2 后做回归护栏: 若产物 asof 早于已提交快照(东财部分失败导致), 还原为已提交。
          if [ -f sentiment/.em_fresh ] && [ "$(cat sentiment/.em_fresh)" = "0" ]; then
            echo "WARN: 东财情绪源在云端 CI 全部抓取失败(.em_fresh=0), 跳过 calc_v2, 直接部署已提交的本地刷新快照 sentiment_v2.json"
          else
            python sentiment/calc_v2.py || echo "WARN: 情绪指数再生失败, 使用已提交的兜底 sentiment_v2.json"
            # R230 回归护栏: calc_v2 产物 asof 早于已提交快照则还原(防东财部分失败致情绪数据回归)
            # R238: 护栏只是兜底辅助, 自身异常不该冻结整个发布 -> 降级为告警
            python sentiment/guard_sentiment_fresh.py || echo "WARN: 情绪回归护栏执行异常, 已忽略(不影响发布)"
          fi
          # R188→R238: 情绪预测精度门禁(分级)。
          #   R188 把它升为 CI 阻断(覆盖率偏离名义50%过多 / MAE退化 / 方向命中率异常 -> exit 1),
          #   对"模型或代码变更后拦截脏精度发布"这个目的而言是对的, 予以保留。
          #   但它同时成了每日数据刷新的**单点故障**: 每日刷新根本不改模型,
          #   却可能因市场状态漂移让回测覆盖率越界, 从而冻结整个看板(连主缠论报告都不更新),
          #   与"每个交易日数据必须当天上线"的核心诉求直接冲突。
          # 故按触发类型分级:
          #   - 定时刷新(schedule)、外部定时(workflow_dispatch)、或本次未改动任何 .py -> 只告警, 不阻断
          #   - push 且改动了 .py(代码/模型变更)                                      -> 严格阻断(保持 R188 强度)
          # R243: workflow_dispatch 必须并入 warn —— cron-job.org 外部定时正是用 dispatch 触发,
          #   它部署的是 main 上已存在的代码(不带来新代码), 若还去查"最近提交是否改过 .py",
          #   只要 main 最近一次提交碰过代码, 外部定时就会随机被门禁误阻断, 一劳永逸方案即告失败。
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            GATE_MODE=warn
          else
            CHANGED_PY=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -E '\.py$' || true)
            if [ -z "$CHANGED_PY" ]; then GATE_MODE=warn; else GATE_MODE=block; fi
          fi
          echo "预测精度门禁模式: ${GATE_MODE} (事件=${{ github.event_name }})"
          if [ "${GATE_MODE}" = "block" ]; then
            python audit_sentiment_forecast_acc.py
          else
            python audit_sentiment_forecast_acc.py || echo "::warning::情绪预测精度指标超出合理区间 —— 本次为数据刷新(未改动代码), 按 R238 降级为告警不阻断, 保证当日数据照常上线; 若持续偏离请检查模型"
          fi
          # R204b-A: 每次部署前同步另一斐波那契项目(A-share-Fibonacci, 已 public)的波浪节点快照,
          # 使跨项目锚点对照随其波浪节点更新而更新。拉取失败不阻断(沿用已提交的内置快照兜底)。
          # 该仓库已设为 public, 无需 token 即可 curl 公开 raw 文件。
          python sentiment/sync_other_fib.py || echo "WARN: 同步另一斐波那契项目波浪节点失败, 沿用内置快照 other_fib_nodes.json"
          python report.py
          # P1: 生成 index.html 前注入「全市场雷达信号条」(读 radar/radar.json, 缺失/异常自动降级纯cp)
          python radar/inject_banner.py report.html

      - name: 标签重叠诊断（非阻塞护栏，仅告警 + 上传 artifact）
        # 实证守卫：R100 日期轴修复(hideOverlap:false + formatter 控显)后，各图表文字
        # 标签应零重叠。每日自动跑一遍，一旦回归即产生重叠对并被记录告警；该步骤
        # 非阻断发布(continue-on-error)但移除 || true——R167 修复: 此前 || true 把门禁
        # 真实失败也静默吞掉, 无法告警; 现保留 continue-on-error 使发布不被阻断,
        # 同时让真实重叠失败以 step 告警可见, 诊断产物上传 artifact 供回溯。
        continue-on-error: true
        run: |
          npm install echarts@^5 --no-save --silent 2>/dev/null || true
          node verify_overlap.js
          echo "—— 标签重叠诊断报告(重叠对数见 total=) ——"
          cat _ov.txt 2>/dev/null || echo "(_ov.txt 未生成)"

      - name: 提交每日构建时间戳（keep-alive，防定时任务被停用）
        run: |
          set -euo pipefail
          # R235: 定时加密到 6 次/天后, 若每次都提交会把仓库历史冲成"一天 6 个 daily build"。
          # keep-alive 的唯一目的只是"保持仓库活跃, 防止 GitHub 停用定时任务"(阈值: 60 天无活动),
          # 一天一次完全足够。故当日(UTC)已打过戳就跳过提交 —— 注意站点发布在后续步骤, 不受影响。
          UTC_DATE=$(date -u +%F)
          if [ -f last_build.txt ] && grep -q "^${UTC_DATE}T" last_build.txt; then
            echo "今日(UTC ${UTC_DATE}) 已提交过构建时间戳, 跳过本次 keep-alive 提交(站点照常发布)"
            exit 0
          fi
          date -u +"%Y-%m-%dT%H:%M:%SZ" > last_build.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 先拉取远端(变基)避免双定时并发/日构建造成的 non-fast-forward 被静默吞掉
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git add last_build.txt
          git commit -m "chore: daily build [skip ci]" || echo "no changes"
          git push || echo "push skipped(keep-alive 推送失败不影响本次站点发布)"

      - name: 配置 Pages
        uses: actions/configure-pages@v6

      - name: 上传产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: 上传标签重叠诊断产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overlap-report
          path: _ov.txt
          if-no-files-found: ignore

      - name: 部署到 GitHub Pages
        uses: actions/deploy-pages@v5
