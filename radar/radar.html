<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A股全市场缠论雷达 · 行业总览</title>
<style>
:root{
  --primary:#2b6cb0; --primary2:#60a5fa; --ink:#1f2937; --muted:#64748b;
  --border:#e2e8f0; --bg:#f5f7fa; --card:#fff;
  --up:#e54545; --down:#18a058;   /* A股约定: 涨红 跌绿 */
  --grad:linear-gradient(120deg,#0f172a 0%,#1e3a5f 52%,#2b6cb0 100%);
  --radius:14px; --shadow:0 1px 3px rgba(15,23,42,.05);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.wrap{max-width:1160px;margin:0 auto;padding:18px 18px 40px}
/* ===== 顶部(与主看板同款深蓝渐变) ===== */
header.top{position:sticky;top:0;z-index:50;background:var(--grad);color:#fff;box-shadow:0 2px 12px rgba(15,23,42,.25)}
header.top .inner{max-width:1160px;margin:0 auto;padding:14px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column}
h1{font-size:20px;font-weight:700;letter-spacing:.5px}
h1 .dot{color:#ffd43b}
.sub{color:#c8d3e2;font-size:12px;margin-top:3px}
.sub b{color:#fff}
.spacer{flex:1}
.goback{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;padding:7px 14px;border-radius:999px;font-size:13px;cursor:pointer;text-decoration:none;transition:.15s;white-space:nowrap}
.goback:hover{background:rgba(255,255,255,.26)}
/* ===== 统计 ===== */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.chip{flex:1 1 auto;min-width:120px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px 14px;text-align:left;box-shadow:var(--shadow);cursor:pointer;transition:.15s}
.chip:hover{border-color:#b7cbe0;transform:translateY(-1px)}
.chip .n{font-size:21px;font-weight:700;line-height:1.25}
.chip .l{font-size:11px;color:var(--muted);margin-top:2px}
.chip.hot{background:#fff8ec;border-color:#f5c26b}
.chip.hot .n{color:#c77700}
.up{color:var(--up)!important}
.down{color:var(--down)!important}
/* ===== 布局 ===== */
.grid{display:grid;grid-template-columns:340px 1fr;gap:14px;margin-top:10px}
@media(max-width:980px){.grid{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.panel-h{display:flex;align-items:center;gap:8px;padding:13px 16px 0;font-size:15px;font-weight:700}
.panel-h .badge{background:var(--primary);color:#fff;font-size:11px;border-radius:20px;padding:1px 9px;font-weight:600}
.panel-h .badge.g{background:var(--down)}
.panel-h .badge.r{background:var(--up)}
.panel-b{padding:12px 14px}
/* ===== 行业列表 ===== */
.ind{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid #f1f5f9;cursor:pointer;transition:.12s;position:relative}
.ind:hover{background:#f8fafc}
.ind:first-of-type{border-top:0}
.ind .nm{font-weight:700;font-size:14px;min-width:74px}
.ind .meta{font-size:11px;color:var(--muted);line-height:1.5}
.ind .spark{width:118px;height:34px;flex:none}
.ind .sgl{font-size:12px;font-weight:700;text-align:right;min-width:64px}
.ind .sgl small{display:block;font-size:10px;color:var(--muted);font-weight:400}
.ind .arrow{color:#cbd5e1;margin-left:2px}
.ind.hl{background:#fffbe8}
.ind.hl .nm{color:#9a6700}
/* ===== 信号列表 ===== */
.sig{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid #f1f5f9;cursor:pointer;transition:.12s}
.sig:hover{background:#f8fafc}
.sig:first-of-type{border-top:0}
.sig .dot{width:9px;height:9px;border-radius:50%;flex:none}
.sig .nm{font-weight:700;font-size:13px}
.sig .meta{font-size:11px;color:var(--muted);margin-top:1px}
.sig .tag{font-size:11px;border-radius:6px;padding:1px 7px;font-weight:600;flex:none}
.sig .tag.t{background:#fdecec;color:#c92a2a}
.sig .tag.b{background:#e6f9f0;color:#087f5b}
.sig .chgx{margin-left:auto;font-weight:700;font-size:14px;text-align:right}
.sig .chgx small{display:block;font-size:10px;font-weight:400;color:var(--muted)}
/* ===== 图表区 ===== */
#mainChart{width:100%;height:560px}
.chart-note{font-size:11px;color:var(--muted);padding:0 16px 8px;line-height:1.7}
.legend-tag{display:inline-block;font-size:11px;margin-right:14px;color:var(--muted)}
.legend-tag i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
/* 次级图表 */
.chart-sec{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:980px){.chart-sec{grid-template-columns:1fr}}
.mini-chart{width:100%;height:300px}
/* ===== 表格 ===== */
.sec-t{display:flex;align-items:center;gap:8px;padding:14px 16px 0;font-size:15px;font-weight:700}
.sec-t .cnt{font-size:12px;color:var(--muted);font-weight:400}
.stk-grid{display:grid;grid-template-columns:minmax(170px,1.3fr) repeat(7,minmax(52px,.7fr)) 22px;gap:6px;align-items:center;padding:9px 16px;font-size:12px;border-top:1px solid #f1f5f9;cursor:pointer;transition:.12s}
.stk-grid:hover{background:#f8fafc}
.stk-grid.head{background:#f8fafc;color:var(--muted);font-size:11px;cursor:default;border-top:0;position:sticky;top:56px;z-index:5}
.stk-grid .nm{font-weight:700;color:var(--ink);font-size:13px}
.stk-grid .cd{color:var(--muted);font-size:10px}
.stk-grid .sub{font-size:11px;color:var(--muted)}
.stk-grid .val{text-align:right;font-variant-numeric:tabular-nums}
.stk-grid .vhl{font-weight:700}
.badge2{display:inline-block;font-size:10px;padding:0 6px;border-radius:4px;font-weight:600}
.badge2.r{background:#fdecec;color:#c92a2a}
.badge2.g{background:#e6f9f0;color:#087f5b}
.badge2.y{background:#fff4e0;color:#9a6700}
.badge2.z{background:#eef2f8;color:#64748b}
/* ===== 详情抽屉(个股) ===== */
.subcrumb{font-size:13px;color:var(--muted);padding:14px 16px 0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.subcrumb a{color:var(--primary);text-decoration:none}
.subcrumb .arr{color:#cbd5e1}
.big-title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:6px 16px 0}
.big-title h2{font-size:26px;font-weight:800}
.big-title .cd{color:var(--muted);font-size:13px}
.metric-strip{display:flex;flex-wrap:wrap;gap:18px;padding:10px 16px 14px;font-size:13px;color:var(--muted)}
.metric-strip b{font-size:18px;color:var(--ink);margin-right:3px}
.signals-box{padding:0 16px 14px}
.signal-pill{border-radius:10px;padding:10px 14px;font-size:13px;line-height:1.6;margin-bottom:8px}
.signal-pill.t{background:#fdecec;border:1px solid #f5c2c2;color:#8a1f1f}
.signal-pill.b{background:#e6f9f0;border:1px solid #b8e6d3;color:#0c5c3c}
.signal-pill b{font-size:14px}
.gate-pill{background:#f1f5f9;border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;font-size:13px;color:#64748b;margin-bottom:8px}
.gate-pill b{color:#475569}
.loading{text-align:center;padding:80px 0;color:var(--muted);font-size:14px}
.err{text-align:center;padding:60px 20px;color:#c92a2a;font-size:13px;line-height:1.8}
.foot{text-align:center;color:#94a3b8;font-size:11px;padding:26px 0 6px;line-height:1.9}
.hidden{display:none}
/* 骨架 */
.sk{animation:sk 1.2s ease-in-out infinite;border-radius:8px}
@keyframes sk{0%,100%{opacity:.5}50%{opacity:1}}
a{color:var(--primary);text-decoration:none}
</style>
</head>
<body>
<header class="top">
  <div class="inner">
    <div class="brand">
      <h1>📡 A股全市场缠论雷达<span class="dot"></span></h1>
      <div class="sub" id="topSub">加载中…</div>
    </div>
    <div class="spacer"></div>
    <a class="goback" href="javascript:toIndex()">← 返回主看板</a>
  </div>
</header>
<div class="wrap">
  <!-- 一级: 行业总览 -->
  <div id="viewHome">
    <div class="chips" id="chipRow"></div>
    <div class="panel">
      <div class="panel-h">全市场信号 <span class="badge" id="sigCnt">…</span> <span style="font-size:12px;color:var(--muted);font-weight:400;margin-left:auto">信号 = 近端背驰场景(≤10交易日) · 点击进入个股</span></div>
      <div class="panel-b" id="sigList"><div class="loading sk">信号加载中…</div></div>
    </div>
    <div class="grid">
      <div class="panel">
        <div class="panel-h">行业指数 <span class="badge" id="indCnt">…</span></div>
        <div class="panel-b" id="indList" style="max-height:640px;overflow:auto"><div class="loading sk">行业加载中…</div></div>
      </div>
      <div class="panel">
        <div class="panel-h">行业缠论结构（选一个行业看总览K线）</div>
        <div class="panel-b" id="indDetail"><div class="loading">点击左侧行业，查看该行业成分股总市值加权K线 + 行业缠论结构 + 成分股信号分布。</div></div>
      </div>
    </div>
    <div class="foot">数据源：标的池/市值 东财行情 · K线 腾讯前复权(主)/新浪日K(备) · 行业K线=成分股总市值加权合成 · 缠论=自研分笔中枢背驰引擎<br>⚠️ 仅供研究参考，不构成投资建议。页宽与主看板一致(1160px)。</div>
  </div>
  <!-- 二级: 个股详情 -->
  <div id="viewStk" class="hidden"></div>
</div>
<script src="vendor/echarts.min.js"></script>
<script>
/* ============================================================
   全市场缠论雷达 v2 · 行业视角
   数据: radar/radar.json (scan_radar.py)
   K线: 行业=radar.json内嵌合成; 个股=腾讯 fqkline (CORS 已开, 浏览器直连)
   ============================================================ */
var UP="#e54545", DN="#18a058", ACC="#2b6cb0";
var M=null, UNI={}, SIG=[], INDS=null;
var curInd=null, curStk=null, myChart=null;
var COL=[[UP,"#ffd9d9"],[DN,"#d7f5e6"]];
function $(id){return document.getElementById(id)}
function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function pct(v,d){if(v==null||isNaN(v))return "-";return (v>0?"+":"")+(v*100).toFixed(d==null?2:d)+"%"}
function capStr(y){if(y==null)return "-";if(y>=1e8)return (y/1e8).toFixed(0)+"亿";if(y>=1e4)return (y/1e4).toFixed(1)+"万";return y}
var qs=(location.hash||"").replace(/^#\/?/,"");
fetch("radar.json").then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(function(d){
  M=d.meta;UNI=d.universe;SIG=d.signals;INDS=d.industries||{};
  renderHeader();renderChips();renderSigs();
  if(qs.indexOf("stk/")===0)showStk(decodeURIComponent(qs.slice(4)));
  else if(qs.indexOf("ind/")===0){pickInd(decodeURIComponent(qs.slice(4)));renderInds(curInd);}
  else renderInds(curInd);
}).catch(function(e){$("topSub").textContent="数据加载失败";$("sigList").innerHTML='<div class="err">无法加载 radar.json：'+esc(e.message)+'<br>请确认已与 radar.json 同目录部署（GitHub Pages / 本地静态服务）。</div>'});

function renderHeader(){
  var m=M||{};
  $("topSub").innerHTML="申万一级 <b>"+(m.n_ind||Object.keys(INDS).length)+"</b> 行业 · 覆盖 <b>"+(m.n_ok||0)+"</b> 只 · 信号 <b>"+(m.n_signal||0)+"</b> · 数据截至 <b>"+(m.asof||"-")+"</b> · "+ (m.build_time||"");
  $("sigCnt").textContent=(m.n_signal||0)+" 个";
  $("indCnt").textContent=(m.n_ind||0)+" 个";
  document.title="A股全市场缠论雷达 · "+(m.asof||"");
}
function renderChips(){
  var m=M||{};
  var items=[["n_ok","有效分析",""],["n_gate","门禁剔除",""],["n_signal","今日信号",""]];
  if(M&&M.gate_cnt){var gc=M.gate_cnt;items.push([gc["低流动性"]||0,"低流动性",""],["","",""]);}
  var ch=[];
  var scen=M&&M.scen_cnt?M.scen_cnt:{};
  ch.push('<div class="chip"><div class="n" style="font-size:14px;line-height:1.3">信号口径</div><div class="l">背驰见底/见顶 近端(≤10交易日)</div></div>');
  ch.push('<div class="chip hot"><div class="n">'+esc(scen["背驰见顶风险"]||0)+'</div><div class="l">顶背驰(风险)</div></div>');
  ch.push('<div class="chip hot"><div class="n" style="color:var(--down)">'+esc(scen["背驰见底机会"]||0)+'</div><div class="l">底背驰(机会)</div></div>');
  ch.push('<div class="chip"><div class="n">'+(m.n_universe||0)+'</div><div class="l">标的池(已剔ST)</div></div>');
  ch.push('<div class="chip"><div class="n">'+(m.excl_st||0)+'</div><div class="l">ST/退市剔除</div></div>');
  $("chipRow").innerHTML=ch.join("");
}
function sparkSVG(d,w,h){
  if(!d||d.length<2)return '<svg width="'+w+'" height="'+h+'"></svg>';
  var ps=d.map(function(k){return k[3]}),min=Math.min.apply(0,ps),max=Math.max.apply(0,ps),rng=(max-min)||1;
  var X=function(i){return 2+(w-4)*i/(d.length-1)},Y=function(v){return 2+(h-4)*(max-v)/rng};
  var up=d[d.length-1][3]>=d[0][3];
  var col=up?"#e54545":"#18a058";
  var pts=d.map(function(k,i){return X(i).toFixed(1)+","+Y(k[3]).toFixed(1)}).join(" ");
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'"><polyline points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="1.6" stroke-linejoin="round"/></svg>';
}
/* ===== 行业列表 ===== */
function renderInds(hl){
  var keys=Object.keys(INDS).sort(function(a,b){return sigScore(b)-sigScore(a)});
  var html="";
  keys.forEach(function(k){
    var x=INDS[k],st=x.st||{};
    var sg=(x.n_sig_top||0)+(x.n_sig_bot||0);
    var cls=sg?" hl":"";
    var scenTxt=st.scenario||"";
    var hl2 = hl===k?"background:#eaf2fb;border-left:3px solid "+ACC:"";
    html+='<div class="ind" style="'+hl2+'" onclick="pickInd(\''+esc(k)+'\')">'+
      '<div class="nm" style="min-width:'+(k.length>4?"60px":"74px")+'">'+esc(k)+'</div>'+
      '<div class="meta">'+capStr(x.cap)+'<br>'+(x.n_member||0)+'只</div>'+
      '<div class="spark">'+sparkSVG(x.spark,118,34)+'</div>'+
      '<div class="sgl '+(x.chg1d>0?"up":(x.chg1d<0?"down":""))+'">'+pct(x.chg1d,1)+
        '<small>顶'+ (x.n_sig_top||0) +' 底'+(x.n_sig_bot||0)+'</small></div>'+
      '<div class="arrow">›</div></div>';
  });
  $("indList").innerHTML=html;
}
function sigScore(k){var x=INDS[k];return (x.n_sig_top||0)*10+(x.n_sig_bot||0)*5+((x.st&&x.st.agree)||0)}
/* ===== 信号列表(首页) ===== */
function renderSigs(){
  var list=SIG.slice().sort(function(a,b){return (b.strong||0)-(a.strong||0)||(a.fresh||9)-(b.fresh||9)||((b.st&&b.st.agree||0)-(a.st&&a.st.agree||0))});
  if(!list.length){$("sigList").innerHTML='<div class="loading">今日无近端背驰信号</div>';return}
  var html='';
  list.slice(0,25).forEach(function(s){
    var t=s.dir==="top",u=UNI[s.sym]||{};
    var st=s.st||{};
    html+='<div class="sig" onclick="showStk(\''+s.sym+'\')">'+
      '<span class="dot" style="background:'+(t?"#c92a2a":"#087f5b")+'"></span>'+
      '<div><div class="nm">'+esc(u.name||s.sym)+'</div><div class="meta">'+(s.ind||"")+' · '+(s.bc_date||"")+'前信号 · '+(s.strong>=2?"强":"中")+' · '+esc(s.bc_type||"")+'</div></div>'+
      '<span class="tag '+(t?"t":"b")+'">'+(t?"顶背驰":"底背驰")+'</span>'+
      '<div class="chgx '+(st.chg1d>0?"up":(st.chg1d<0?"down":""))+'">'+pct(st.chg1d,1)+'<small>'+(s.fresh!=null?s.fresh+"日前":"")+'</small></div>'+
      '</div>';
  });
  $("sigList").innerHTML=html;
}
/* ===== 行业详情 + 缠论总览K线 ===== */
function pickInd(k){
  var ind=INDS[k];
  if(!ind){$("indDetail").innerHTML='<div class="err">行业 '+esc(k)+' 无数据(可能成分不足未合成)</div>';return}
  curInd=k;
  if(("ind/"+k)!==(location.hash||"").replace(/^#\/?/,""))location.hash="#ind/"+encodeURIComponent(k);
  renderInds(k);
  var st=ind.st||{},scen=st.scenario||"";
  var cls=scen.indexOf("见底")>=0?"g":(scen.indexOf("见顶")>=0?"r":"y");
  var bd='<span class="badge2 '+cls+'">'+esc(scen||"无场景")+'</span>';
  // 行业结构指标
  var sigTop=(ind.n_sig_top||0),sigBot=(ind.n_sig_bot||0);
  var html='<div style="padding:12px 16px 4px;font-size:13px;line-height:1.9">'+
    '<b style="font-size:17px">'+esc(k)+'</b> <span style="color:var(--muted)">申万一级 · '+capStr(ind.cap)+' · '+(ind.n_member||0)+'只成分(通过门禁) · 行业指数'+pct(ind.chg1d,2)+'</span>'+
    '<br>行业缠论：'+bd+' · 趋势 '+esc(st.trend||"-")+' · 笔 '+(st.bi_n||0)+' · 中枢 '+(st.zs_n||0)+' · 自洽率 '+(st.agree!=null?(st.agree*100).toFixed(0)+"%":"-")+
    '<br><span class="badge2 r">见顶风险成分 '+(sigTop)+'</span> <span class="badge2 g">见底机会成分 '+(sigBot)+'</span>'+
    '</div>';
  html+='<div class="chart-note"><span class="legend-tag"><i style="background:#e54545"></i>涨</span><span class="legend-tag"><i style="background:#18a058"></i>跌</span><span class="legend-tag"><i style="background:#7f77dd"></i>行业笔(合成)</span><span class="legend-tag"><i style="background:rgba(127,119,221,.25)"></i>行业中枢</span><span class="legend-tag"><i style="background:#c92a2a"></i>顶背驰</span><span class="legend-tag"><i style="background:#087f5b"></i>底背驰</span></div>';
  html+='<div id="mainChart"><div class="loading sk">行业K线渲染中…</div></div>';
  html+='<div style="padding:10px 16px"><div class="sec-t" style="padding:0;margin-bottom:8px">成分股信号 <span class="cnt">'+k+' 行业 · 信号票可点击看个股</span></div></div>';
  html+='<div id="indStkList" style="padding:0 0 12px"><div class="loading sk">加载…</div></div>';
  $("indDetail").innerHTML=html;
  drawIndChart(k);
  renderIndStkList(k);
}
function indKlineOption(kl){
  var dates=kl.map(function(k){return k.date});
  var kdata=kl.map(function(k){return [k.open,k.close,k.low,k.high]});
  var vols=kl.map(function(k){var up=k.close>=k.open;return {value:k.volume,itemStyle:{color:up?UP:DN,opacity:.75}}});
  var ma=function(n,col){var r=[];for(var i=0;i<kl.length;i++){if(i<n-1){r.push("-");continue}var s=0;for(var j=i-n+1;j<=i;j++)s+=kl[j].close;r.push(+(s/n).toFixed(2))}return {name:"MA"+n,type:"line",data:r,smooth:false,symbol:"none",lineStyle:{width:1,color:col}}};
  return {
    animation:false,backgroundColor:"#fff",
    tooltip:{trigger:"axis",axisPointer:{type:"cross"},backgroundColor:"rgba(15,23,42,.9)",textStyle:{fontSize:11},borderWidth:0,
      formatter:function(ps){var p=ps[0];if(!p||!p.axisValue)return"";var i=ps[0].dataIndex;var k=kl[i];if(!k)return p.axisValue;
        var up=k.close>=k.open;return "<b>"+k.date+"</b><br/>开 "+k.open+"　收 "+k.close+(up?" ▲":" ▼")+"<br/>高 "+k.high+"　低 "+k.low;}},
    legend:{data:["K线","MA5","MA10","MA20"],top:6,textStyle:{fontSize:11},itemWidth:14,itemHeight:8},

           {scale:true,gridIndex:1,axisLabel:{show:false},splitLine:{show:false},axisLine:{show:false},axisTick:{show:false}}],

    ]
  };
}
function chanMarkOption(mark,dates){
  var ser=[];
  if(!mark)return ser;
  var di={};dates.forEach(function(d,i){di[d]=i});
  function xi(dt){return di[dt]!=null?di[dt]:null}
  /* 笔 */
  if(mark.line&&mark.line.length){
    var data=[];
    mark.line.forEach(function(b){
      var x1=xi(b[0]),x2=xi(b[2]);
      if(x1==null||x2==null)return;
      data.push([x1,b[1]],[x2,b[3]]);
    });
    if(data.length)ser.push({name:"笔",type:"line",data:data,symbol:"none",lineStyle:{width:1,color:"#7f77dd"},z:2,clip:true});
  }
  /* 中枢: markArea 由数据+itemStyle 不适用, 用自定义矩形 markArea 需要两条 data. 采用 markArea via 两个锚点 */
  if(mark.zs&&mark.zs.length){
    var areas=[];
    mark.zs.forEach(function(z){
      var x1=xi(z[2]),x2=xi(z[3]);
      if(x1==null||x2==null)return;
      areas.push([{name:"中枢",xAxis:x1,yAxis:z[1],itemStyle:{color:"rgba(127,119,221,.16)",borderColor:"#7f77dd",borderWidth:.8}},{xAxis:x2,yAxis:z[0]}]);
    });
    if(areas.length)ser.push({name:"中枢",type:"line",data:[],markArea:{silent:true,itemStyle:{color:"transparent"},data:areas}});
  }
  /* 背驰点 顶/底 (data bc[0] = 'top'/'bottom' 或 中文'顶背驰'/'底背驰') */
  var tp=[],bp=[];
  (mark.bc||[]).forEach(function(b){
    var x=xi(b[1]);if(x==null)return;
    var isTop=b[0]==="top"||b[0]===1||String(b[0]).indexOf("顶")>=0;
    (isTop?tp:bp).push({value:[x,b[2]]});
  });
  function sc(col,dir,rot){return {name:dir,type:"scatter",data:dir==="顶背驰"?tp:bp,symbol:"triangle",symbolSize:12,symbolRotate:dir==="顶背驰"?180:0,itemStyle:{color:col,borderColor:"#fff",borderWidth:1},z:6,label:{show:true,formatter:dir,fontSize:9,position:dir==="顶背驰"?"top":"bottom",color:col,fontWeight:"700"}}}
  if(tp.length)ser.push(sc("#c92a2a","顶背驰",180));
  if(bp.length)ser.push(sc("#087f5b","底背驰",0));
  return ser;
}
function drawIndChart(k){
  var ind=INDS[k];var kl=ind.kline||[];
  if(!kl.length){$("mainChart").innerHTML='<div class="err">该行业合成K线为空</div>';return}
  var opt=indKlineOption(kl);
  var extra=chanMarkOption(ind.mark,kl.map(function(x){return x.date}));
  opt.series=opt.series.concat(extra);
  opt.legend.data.push("笔","顶背驰","底背驰");
  if(myChart){myChart.dispose()}
  myChart=echarts.init($("mainChart"),null,{renderer:"svg"});
  myChart.setOption(opt);
  window.addEventListener("resize",function(){myChart&&myChart.resize()});
}
/* 行业成分股列表(按信号分组) */
function renderIndStkList(k){
  var members=[];Object.keys(UNI).forEach(function(sym){
    var u=UNI[sym];if(u.ind===k&&!u.gate)members.push(sym);
  });
  // 与信号关联
  var sigBy={};SIG.forEach(function(s){sigBy[s.sym]=s});
  var list=members.map(function(sym){
    var u=UNI[sym];var s=u.st||{};var sg=sigBy[sym]||null;
    return {sym:sym,u:u,st:s,sg:sg,scen:s.scenario||""};
  });
  var gTop=list.filter(function(x){return x.sg&&x.sg.dir==="top"});
  var gBot=list.filter(function(x){return x.sg&&x.sg.dir==="bottom"});
  var gRest=list.filter(function(x){return !x.sg});
  gRest.sort(function(a,b){return (b.st.agree||0)-(a.st.agree||0)||(b.u.mcap||0)-(a.u.mcap||0)});
  function sec(title,cnt,rows,opt){
    if(!rows.length)return'';
    var cls=opt.cls||"",ic=opt.ic||"";
    var head='<div style="padding:8px 16px;background:#f8fafc;border-top:1px solid #eef2f7;font-size:12px;color:var(--muted)">'+ic+' '+title+' <b style="color:var(--ink)">'+cnt+'</b>'+(opt.note?' · '+opt.note:'')+'</div>';
    var body=rows.slice(0,opt.max||30).map(function(x){
      var u=x.u,s=x.st;var chg=s.chg1d;var sigTxt=x.sg?((x.sg.dir==="top"?"顶背驰":"底背驰")+" "+(x.sg.bc_date||"")):(s.scenario||"");
      var tag='';
      if(x.sg)tag='<span class="badge2 '+(x.sg.dir==="top"?"r":"g")+'">'+(x.sg.dir==="top"?"顶":"底")+'信号</span>';
      else if(s.scenario&&s.scenario.indexOf("见")>=0)tag='<span class="badge2 '+(s.scenario.indexOf("见底")>=0?"g":"r")+'">'+esc(s.scenario)+'</span>';
      else if(s.scenario)tag='<span class="badge2 z">'+esc(s.scenario)+'</span>';
      return '<div class="stk-grid" onclick="showStk(\''+x.sym+'\')">'+
        '<div><div class="nm">'+esc(u.name)+'</div><div class="cd">'+esc(x.sym)+'</div></div>'+
        '<div class="val">'+tag+'</div>'+
        '<div class="val">'+esc(s.trend||"-")+'</div>'+
        '<div class="val">'+(s.zs_last?("["+s.zs_last.zd+"~"+s.zs_last.zg+"]"):"-")+'</div>'+
        '<div class="val">'+(s.bi_n||0)+'</div>'+
        '<div class="val">'+(s.zs_n||0)+'</div>'+
        '<div class="val">'+(s.agree!=null?(s.agree*100).toFixed(0)+"%":"-")+'</div>'+
        '<div class="val vhl '+(chg>0?"up":(chg<0?"down":""))+'">'+pct(chg,2)+'</div>'+
        '<div class="arr" style="color:#cbd5e1">›</div></div>';
    }).join("");
    return '<div style="border-top:1px solid #eef2f7">'+head+body+(rows.length>(opt.max||30)?'<div style="padding:8px 16px;font-size:11px;color:#a3adb8;text-align:center">仅显示前'+(opt.max||30)+'只(共'+rows.length+')</div>':'')+'</div>';
  }
  var head='<div class="stk-grid head"><div>名称</div><div class="val">信号</div><div class="val">趋势</div><div class="val">末中枢</div><div class="val">笔</div><div class="val">中枢</div><div class="val">自洽</div><div class="val">涨跌</div><div></div></div>';
  $("indStkList").innerHTML=head+
    sec("见顶风险",gTop.length,gTop,{cls:"t",ic:"🔴",note:"顶背驰·注意回落"})+
    sec("见底机会",gBot.length,gBot,{cls:"g",ic:"🟢",note:"底背驰·关注企稳"})+
    sec("其余通过门禁",gRest.length,gRest,{ic:"📄",note:"按自洽率排序"})+
    (members.length?"":'<div class="loading">该行业无通过门禁的成分</div>');
}
/* ===== 个股详情 ===== */
function showStk(sym){
  var u=UNI[sym];
  if(!u){alert("未收录 "+sym);return}
  curStk=sym;
  $("viewHome").classList.add("hidden");
  $("viewStk").classList.remove("hidden");
  var s=u.st||{};var stk=SIG.filter(function(x){return x.sym===sym})[0]||null;
  location.hash="#stk/"+sym;
  window.scrollTo(0,0);
  var scen=s.scenario||"";
  var titleHtml='<div class="subcrumb"><a href="javascript:backHome()">📡 雷达首页</a> <span class="arr">›</span> '+(u.ind?'<a href="javascript:pickIndFromStk(\''+esc(u.ind)+'\')">'+esc(u.ind)+'</a> <span class="arr">›</span> ':'')+'<span style="color:var(--ink)">'+esc(u.name)+'</span></div>';
  titleHtml+='<div class="big-title"><h2>'+esc(u.name)+'</h2><span class="cd">'+esc(sym)+' · '+esc(u.code)+' · '+esc(u.type)+' · '+esc(u.ind||"-")+'</span></div>';
  titleHtml+='<div class="metric-strip">'+
    '<span>现价 <b class="'+(s.chg1d>0?"up":(s.chg1d<0?"down":""))+'">'+(s.close!=null?s.close:"-")+'</b>'+pct(s.chg1d,2)+'</span>'+
    '<span>场景 <b>'+esc(scen||"-")+'</b></span>'+
    '<span>趋势 <b>'+esc(s.trend||"-")+'</b></span>'+
    '<span>笔/中枢 <b>'+(s.bi_n||0)+'/'+(s.zs_n||0)+'</b></span>'+
    '<span>自洽 <b>'+(s.agree!=null?(s.agree*100).toFixed(0)+"%":"-")+'</b></span>'+
    '<span>区间 <b>'+(s.first||"-")+'~'+(s.last||"-")+'</b></span>'+
    '<span>数据 <b>'+(s.n_bars||0)+'根/'+(s.src||"-")+'</b></span></div>';
  var banner='';
  if(stk){
    var t=stk.dir==="top";
    banner+='<div class="signals-box"><div class="signal-pill '+(t?"t":"b")+'"><b>'+(t?"⚠️ 顶背驰风险":"✅ 底背驰机会")+'</b> · '+(stk.bc_date||"")+'前('+(stk.fresh||"?")+'个交易日) · '+(stk.bc_type||"")+' · 强度'+(stk.strong||0)+'/2'+(stk.vol?" · 量缩确认":"")+'<br><span style="opacity:.85;font-size:12px">'+(t?"上攻动能减弱，注意中枢上沿/前高压力":"下跌动能衰竭，关注中枢下沿支撑与企稳信号")+'</span></div></div>';
  }else if(u.gate){
    banner='<div class="signals-box"><div class="gate-pill"><b>门禁：'+esc(u.gate)+'</b><br>'+esc(u.gd||"")+'　<span style="font-size:12px">(仍展示K线与结构，但不进信号区)</span></div></div>';
  }else if(scen){
    banner='<div class="signals-box"><div class="gate-pill">当前场景：<b>'+esc(scen)+'</b> · 趋势 '+esc(s.trend||"-")+'　<span style="font-size:12px">(非近端背驰信号，仅结构参考)</span></div></div>';
  }
  // 60日K线快照仅当日信号票内嵌; 非信号票不显示迷你卡, 结构明细整行铺开
  var sgx=null;SIG.forEach(function(x){if(x.sym===sym)sgx=x});
  var sp=sgx?sgx.spark:null;
  var hasMini=!!(sp&&sp.data&&sp.data.length>1);
  var miniCol=hasMini?'<div><div class="chart-note">近60日迷你走势(K线快照)</div><div id="stkMini" style="height:150px"></div></div>':'';
  var infoCol='<div style="font-size:12px;line-height:2.1;color:#475569;padding:6px 2px'+(hasMini?'':';grid-column:1/-1')+'">'+
      '<b style="font-size:13px">缠论结构</b><br>· 笔数 '+(s.bi_n||0)+' / 中枢 '+(s.zs_n||0)+' / 背驰 '+(s.bc_n||0)+' / 买卖点 '+(s.sig_n||0)+'<br>· 末段中枢 '+(s.zs_last?("["+s.zs_last.zd+" ~ "+s.zs_last.zg+"] 结束于 "+s.zs_last.date_end):"无")+'<br>· 分笔自洽率 '+(s.agree!=null?(s.agree*100).toFixed(1)+"%": "-")+' ('+(s.agree_n||0)+'笔)'+
      '<br>· 近60日均额 '+(s.avg_amt60!=null?capStr(s.avg_amt60*1e4)+"元":"-")+' · 振幅中位 '+(s.med_amp!=null?s.med_amp+"%":"-")+'<br>· 一字板 '+(s.one_word||0)+'日 · 距高点回撤 '+(s.dd!=null?(s.dd*100).toFixed(1)+"%":"-")+'</div>';
  var stkHtml=banner+
    '<div class="panel"><div class="chart-note"><span class="legend-tag"><i style="background:#e54545"></i>涨</span><span class="legend-tag"><i style="background:#18a058"></i>跌</span><span class="legend-tag"><i style="background:#7f77dd"></i>笔</span><span class="legend-tag"><i style="background:rgba(127,119,221,.25)"></i>中枢</span><span class="legend-tag"><i style="background:#c92a2a"></i>顶背驰(红▼)</span><span class="legend-tag"><i style="background:#087f5b"></i>底背驰(绿▲)</span></div><div id="stkChart" style="width:100%;height:600px"><div class="loading sk">行情加载中…</div></div></div>'+
    '<div class="sec-t">结构明细 <span class="cnt">来自扫描快照(截至 '+esc(s.last||"")+')</span></div>'+

    '<div class="foot">行情为浏览器实时拉取(腾讯前复权)；缠论标注按扫描时结构对齐日期。研究参考，不构成投资建议。</div>';
  $("viewStk").innerHTML=titleHtml+stkHtml;
  loadStkChart(sym);
  if(hasMini)drawStkMini(sp);
}
function backHome(){$("viewStk").classList.add("hidden");$("viewHome").classList.remove("hidden");location.hash="#/";curStk=null;renderInds(curInd);renderSigs()}
function pickIndFromStk(k){backHome();renderInds(k);pickInd(k)}
function toIndex(){location.href=location.href.split("/radar/")[0]+"/index.html"}
function loadStkChart(sym){
  fetch("https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param="+sym+",day,,,660,qfq").then(function(r){return r.json()}).then(function(j){
    var kl=(j.data[sym]||{}).qfqday||[];
    if(!kl.length)throw new Error("empty");
    var k2=kl.map(function(r){return {date:r[0],open:+r[1],close:+r[2],high:+r[3],low:+r[4],volume:(+r[5])/100}});
    var el=$("stkChart");el.innerHTML="";
    var opt=indKlineOption(k2);
    var u=UNI[sym];var extra=chanMarkOption(u.mark,k2.map(function(x){return x.date}));
    opt.series=opt.series.concat(extra);
    opt.legend.data.push("笔","顶背驰","底背驰");
    var ch=echarts.init(el,null,{renderer:"svg"});
    ch.setOption(opt);
    window.addEventListener("resize",function(){ch.resize()});
  }).catch(function(e){$("stkChart").innerHTML='<div class="err">实时行情拉取失败：'+esc(e.message)+'<br>（腾讯 fqkline 需在浏览器环境访问，file:// 可能被拦；可用 GitHub Pages / 本地 http 服务）</div>'});
}
function drawStkMini(sp){
  var data=sp.data.map(function(k){return {date:sp.d0,open:k[0],close:k[1],low:k[2],high:k[3]}});
  if(!data||data.length<2)return;
  var mini=$("stkMini");if(!mini)return;
  var ch=echarts.init(mini,null,{renderer:"svg"});
  ch.setOption({animation:false,grid:{left:6,right:6,top:6,bottom:6},
    xAxis:{type:"category",data:data.map(function(x){return x.date}),show:false},
    yAxis:{type:"value",scale:true,show:false},
    series:[{type:"line",data:data.map(function(x){return x.close}),smooth:false,symbol:"none",lineStyle:{width:1.2,color:x2=(data[data.length-1].close>=data[0].close?UP:DN)}}]});
  window.addEventListener("resize",function(){ch.resize()});
}
/* 简单哈希路由 */
window.addEventListener("hashchange",function(){
  var h=(location.hash||"").replace(/^#\/?/,"");
  if(h.indexOf("stk/")===0){var s=decodeURIComponent(h.slice(4));if(curStk!==s)showStk(s);}
  else if(h.indexOf("ind/")===0){var k=decodeURIComponent(h.slice(4));if(curInd!==k)pickInd(k);}
  else if(!h)backHome();
});
