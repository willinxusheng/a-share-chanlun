<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A股全市场缠论雷达 · 行业总览</title>
<style>
:root{
  --primary:#2b6cb0; --primary2:#60a5fa; --ink:#1f2937; --muted:#64748b;
  --border:#e2e8f0; --bg:#f2f5f9; --card:#fff;
  --up:#e54545; --down:#18a058;   /* A股约定: 涨红 跌绿 */
  --up-soft:#fdecec; --down-soft:#e6f9f0;
  --grad:linear-gradient(120deg,#0f172a 0%,#1e3a5f 52%,#2b6cb0 100%);
  --radius:14px;
  --shadow:0 1px 3px rgba(15,23,42,.05);
  --shadow-lg:0 4px 16px rgba(15,23,42,.08);
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font-ui);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-variant-numeric:tabular-nums;letter-spacing:.1px}
b,strong{font-weight:700}
.wrap{max-width:1160px;margin:0 auto;padding:18px 18px 44px}
/* ===== 顶部(与主看板同款: 限宽圆角渐变卡, 与正文同列对齐) ===== */
header.top{max-width:1160px;margin:0 auto;padding:14px 18px 0;color:#fff}
header.top .inner{padding:12px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:relative;min-height:52px;background:var(--grad);border-radius:15px;box-shadow:0 4px 16px rgba(15,23,42,.18)}
.brand{display:flex;flex-direction:column;flex:1 1 auto;min-width:0;padding-right:124px}
h1{font-size:21px;font-weight:700;letter-spacing:.4px;line-height:1.3}
h1 .dot{color:#ffd43b}
.sub{color:#c8d3e2;font-size:12px;margin-top:4px;line-height:1.6}
.sub b{color:#fff;font-weight:600}
.spacer{display:none}
.goback{position:absolute;top:14px;right:18px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.38);color:#fff;padding:7px 15px;border-radius:999px;font-size:13px;cursor:pointer;text-decoration:none;transition:.18s;white-space:nowrap;line-height:1.4;box-shadow:inset 0 0 0 0 rgba(255,255,255,.2)}
.goback:hover{background:rgba(255,255,255,.26);border-color:rgba(255,255,255,.6)}
/* ===== 概要条 ===== */
.bar{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 0}
.bar .pill{flex:1 1 0;min-width:112px;background:#fff;border:1px solid var(--border);border-radius:11px;padding:9px 13px;box-shadow:var(--shadow);transition:box-shadow .15s}
.bar .pill:hover{box-shadow:var(--shadow-lg)}
.bar .pill .l{font-size:11px;color:var(--muted);letter-spacing:.2px}
.bar .pill .v{font-size:17px;font-weight:700;color:var(--ink);margin-top:3px;line-height:1.35;letter-spacing:-.2px}
.bar .pill .v .num{font-weight:800}
.bar .pill.hot .v{color:#c77700}
.bar .pill.cool .v{color:#087f5b}
.bar .idx-ld{color:#94a3b8;font-weight:400;font-size:13px}
/* ===== 行业列表(平铺 + 专业信息) ===== */
.ind-panel{margin-top:16px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.ind-panel .head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #eef2f7;flex-wrap:wrap}
.ind-panel .head h2{font-size:16px;font-weight:700;letter-spacing:.2px}
.ind-panel .head .badge{background:var(--primary);color:#fff;font-size:11px;border-radius:20px;padding:2px 10px;font-weight:600;line-height:1.6}
.ind-panel .head .hint{font-size:12px;color:var(--muted);margin-left:auto}
.ind-panel .head .tabs{display:flex;gap:3px;background:#eef2f7;border-radius:9px;padding:3px}
.ind-panel .head .tabs a{font-size:12px;padding:4.5px 11px;border-radius:7px;cursor:pointer;color:var(--muted);text-decoration:none;line-height:1.5;transition:background .15s,color .15s;white-space:nowrap}
.ind-panel .head .tabs a:hover{color:var(--ink)}
.ind-panel .head .tabs a.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.ind-grid{display:grid;grid-template-columns:1.35fr .72fr .72fr 1.45fr .58fr 1.05fr 26px;gap:8px;align-items:center;padding:9px 16px;font-size:11px;font-weight:600;letter-spacing:.3px;background:#f8fafc;color:#5b6b81;border-bottom:1px solid #e2e8f0;border-top:1px solid #eef2f7;position:sticky;top:0;z-index:30;box-shadow:0 1px 0 #fff,0 2px 6px rgba(15,23,42,.06)}
.ind-row{display:grid;grid-template-columns:1.35fr .72fr .72fr 1.45fr .58fr 1.05fr 26px;gap:8px;align-items:center;padding:10px 16px;border-top:1px solid #f1f5f9;cursor:pointer;transition:background .12s}
.ind-row:hover{background:#f4f8fc}
.ind-row:first-of-type{border-top:0}
.ind-row.hl{background:#e8f1fb;box-shadow:inset 3px 0 0 var(--primary)}
.ind-row.strong-top{border-left:3px solid var(--up);padding-left:13px;background:linear-gradient(90deg,#fff8f8,#fff)}
.ind-row.strong-bot{border-left:3px solid var(--down);padding-left:13px;background:linear-gradient(90deg,#f3fbf6,#fff)}
.rsi-cell{display:inline-block;padding:1.5px 8px;border-radius:5px;font-weight:700;line-height:1.6}
.rsi-cell.hot{background:var(--up-soft);color:#c92a2a}
.rsi-cell.cold{background:var(--down-soft);color:#087f5b}
.rsi-cell.mid{background:#f1f5f9;color:#475569}
.ind-row .nm{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:6px;line-height:1.45;letter-spacing:.2px}
.ind-row .meta{font-size:11px;color:var(--muted);line-height:1.6}
.ind-row .spark{width:100%;height:34px;display:block}
.ind-row .chg{font-weight:700;font-size:13.5px;text-align:right;line-height:1.3}
.ind-row .ctr{font-size:11px;color:var(--muted);text-align:right}
.ctr-top{display:flex;align-items:center;justify-content:flex-end;gap:5px}
.ctr-sub{font-size:10px;color:var(--muted);margin-top:3px;text-align:right;line-height:1.4}
.rsi-bar{position:relative;display:inline-block;width:58px;height:4px;border-radius:2px;margin:3px 0 0 auto;flex:none;vertical-align:middle}
.rsi-bar i{position:absolute;top:-2px;width:2px;height:8px;background:#334155;border-radius:1px}
.ctr-top .rsi-bar{margin-top:0}
.dstrip .rsi-bar{margin:0 2px}
.ind-row .arrow{color:#cbd5e1;margin-left:2px;text-align:center;font-size:14px}
.ta-r{text-align:right}
.up{color:var(--up)!important}
.down{color:var(--down)!important}
/* 走势背驰状态标签 */
.regime{display:inline-block;font-size:10.5px;font-weight:700;border-radius:5px;padding:2px 7px;line-height:1.6;letter-spacing:.2px}
.regime.top{background:var(--up-soft);color:#c92a2a}
.regime.bot{background:var(--down-soft);color:#087f5b}
.regime.up{background:#fef3c7;color:#92400e}
.regime.dn{background:#e0f2fe;color:#075985}
.regime.flat{background:#eef2f8;color:#64748b}
/* 行业详情头部专业指标带 */
.dstrip{display:flex;flex-wrap:wrap;align-items:center;gap:7px 18px;padding:10px 16px;background:#f8fafc;border-bottom:1px solid #eef2f7;font-size:12px;color:#475569;line-height:1.8}
.dstrip>span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.dstrip .dld{margin-left:auto;gap:10px;flex-wrap:wrap}
.dstrip b{color:#1e293b;font-weight:700}
.dstrip .up b,.dstrip .down b{color:inherit}
.dstrip .rsi-cell{margin:0}
.dstrip .dsep{color:#cbd5e1;margin:0 -6px}
.dstrip .muted{color:#94a3b8;font-weight:400}
/* 涨跌单元格内 相对大盘 次级文案 */
.vsub{font-size:10px;font-weight:400;text-align:right;margin-top:2px;line-height:1.3;white-space:nowrap;opacity:.92}
/* 板块异动小徽章 / 成分股信号新鲜度 */
.mvmini{font-size:10.5px;color:var(--muted);line-height:1.5;white-space:nowrap;display:inline-flex;gap:3px;align-items:center}
.fsub{font-size:10px;color:#7a8699;margin-top:2px;white-space:nowrap;line-height:1.4;opacity:.9}
.fsub.urg{font-weight:700;opacity:1}
.ld-name{max-width:88px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:bottom}
/* 行业详情(K线/成分股) */
#indDetail{margin-top:16px}
.panel{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
/* 行业详情面板头(标题+状态+双tab) */
.det-head{display:flex;align-items:center;gap:10px 12px;padding:13px 16px;flex-wrap:wrap;border-bottom:1px solid #eef2f7}
.det-head .det-title{font-size:17px;font-weight:700;letter-spacing:.2px;display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.det-head .det-sub{color:var(--muted);font-size:12.5px;font-weight:400;line-height:1.6}
.det-tabs{display:flex;gap:3px;background:#eef2f7;border-radius:9px;padding:3px;margin-left:auto}
.det-tabs .ind-tab{font-size:12.5px;padding:5px 13px;border-radius:7px;cursor:pointer;color:var(--muted);line-height:1.6;white-space:nowrap;transition:background .15s,color .15s;text-decoration:none}
.det-tabs .ind-tab:hover{color:var(--ink)}
.det-tabs .ind-tab.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.stk-panel{margin-top:14px;padding:0}
.chart-note{font-size:11.5px;color:var(--muted);padding:8px 16px 9px;line-height:1.8}
.legend-tag{display:inline-flex;align-items:center;font-size:11.5px;margin-right:16px;color:var(--muted);line-height:1}
.legend-tag i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
#mainChart{width:100%;height:620px}
.mini-chart{width:100%;height:300px}
/* ===== 表格(成分股信号列表) ===== */
.sec-t{display:flex;align-items:baseline;gap:8px;padding:16px 16px 0;font-size:16px;font-weight:700;letter-spacing:.2px}
.sec-t .cnt{font-size:12px;color:var(--muted);font-weight:400}
.ghead{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;padding:9px 16px;background:#f4f7fa;border-top:1px solid #e8edf4;font-size:12px;color:var(--muted)}
.ghead .gttl{font-weight:700;color:#334155;display:inline-flex;align-items:center;gap:6px;font-size:12.5px}
.ghead .gcnt{color:var(--ink);font-size:12px;background:#e9eef5;border-radius:9px;padding:0 8px;line-height:1.7;min-width:22px;text-align:center}
.ghead .gnote{color:var(--muted);font-size:11.5px}
.ghead .gavg{margin-left:auto;font-weight:700;font-size:12px}
.list-note{padding:8px 16px;font-size:11px;color:#94a3b8;text-align:center;background:#fcfdff;border-top:1px dashed #eef2f7}
.stk-grid{display:grid;grid-template-columns:minmax(170px,1.3fr) repeat(8,minmax(48px,.66fr)) 22px;gap:6px;align-items:center;padding:9.5px 16px;font-size:12px;border-top:1px solid #f1f5f9;cursor:pointer;transition:background .12s}
.stk-grid:hover{background:#f4f8fc}
.stk-grid.hl{background:#e8f1fb;box-shadow:inset 3px 0 0 var(--primary)}
.stk-grid .arr{color:#cbd5e1;text-align:center;font-size:13px;opacity:.85}
.stk-grid:hover .arr{opacity:1;color:#94a3b8}
.stk-grid.head{background:#f8fafc;color:#5b6b81;font-size:11px;font-weight:600;letter-spacing:.3px;cursor:default;border-top:0;border-bottom:1px solid #e8edf4}
/* 浮动表头 clone: 仅 JS 在真实表头滚出视口时插入, 避免遮挡首只股票 */
.stk-head-float{position:fixed;left:50%;transform:translateX(-50%);top:0;width:var(--wrap-w,1160px);max-width:calc(100vw - 36px);background:rgba(248,250,252,.96);backdrop-filter:saturate(160%) blur(8px);-webkit-backdrop-filter:saturate(160%) blur(8px);color:#5b6b81;font-size:11px;font-weight:600;letter-spacing:.3px;border-bottom:1px solid #e8edf4;box-shadow:0 4px 12px rgba(15,23,42,.06);z-index:35;display:none;padding:9.5px 16px}
.stk-head-float.show{display:grid}
.stk-head-float .arr{display:none}
.stk-grid .nm{font-weight:700;color:var(--ink);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;line-height:1.5}
.stk-grid .cd{color:var(--muted);font-size:10.5px;line-height:1.4;margin-top:1px}
.stk-grid .val{text-align:right}
.stk-grid .vhl{font-weight:700}
.badge2{display:inline-block;font-size:11px;padding:1px 7px;border-radius:5px;font-weight:600;line-height:1.7}
.badge2.r{background:var(--up-soft);color:#c92a2a}
.badge2.g{background:var(--down-soft);color:#087f5b}
.badge2.y{background:#fff4e0;color:#9a6700}
.badge2.z{background:#eef2f8;color:#64748b}
.badge2.o{background:#e0f2fe;color:#075985}
/* ===== 详情抽屉(个股) ===== */
.subcrumb{font-size:13px;color:var(--muted);padding:16px 16px 0;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.subcrumb a{color:var(--primary);text-decoration:none;cursor:pointer;font-weight:600}
.subcrumb a:hover{text-decoration:underline}
.subcrumb .arr{color:#cbd5e1}
.big-title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:8px 16px 0}
.big-title h2{font-size:27px;font-weight:800;letter-spacing:.2px;line-height:1.3}
.big-title .cd{color:var(--muted);font-size:13px}
.metric-strip{display:flex;flex-wrap:wrap;gap:18px;padding:10px 16px 16px;font-size:13px;color:var(--muted)}
.metric-strip span{white-space:nowrap}
.metric-strip b{font-size:19px;color:var(--ink);margin-right:4px;line-height:1.4}
.signals-box{padding:0 16px 16px}
.signal-pill{border-radius:11px;padding:11px 15px;font-size:13px;line-height:1.7;margin-bottom:10px}
.signal-pill.t{background:var(--up-soft);border:1px solid #f5c2c2;color:#8a1f1f}
.signal-pill.b{background:var(--down-soft);border:1px solid #b8e6d3;color:#0c5c3c}
.signal-pill b{font-size:14.5px}
.gate-pill{background:#f1f5f9;border:1px solid #e2e8f0;border-radius:11px;padding:11px 15px;font-size:13px;color:#64748b;margin-bottom:10px;line-height:1.7}
.gate-pill b{color:#475569}
.chart-sec{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:980px){.chart-sec{grid-template-columns:1fr}}
@media(max-width:980px){.ind-grid,.ind-row{grid-template-columns:1fr .7fr .7fr 1.2fr .6fr .9fr 22px}}
/* 折叠展开按钮 + 空态 */
.more{text-align:center;padding:2px 16px 12px;background:linear-gradient(180deg,transparent,rgba(248,250,252,.9) 30%,#fff)}
.more a{display:inline-flex;align-items:center;gap:4px;cursor:pointer;color:var(--primary);font-size:13px;font-weight:600;padding:6px 14px;border-radius:8px;background:#fff;border:1px solid #dbe3ee;box-shadow:var(--shadow);transition:.15s}
.more a:hover{border-color:var(--primary);box-shadow:0 2px 8px rgba(43,108,176,.15)}
.empty{text-align:center;padding:56px 20px;color:var(--muted)}
.empty .eic{font-size:34px;opacity:.45;line-height:1;display:block;margin-bottom:10px}
.empty .etx{font-size:13px}
.loading{text-align:center;padding:80px 0;color:var(--muted);font-size:14px;line-height:2}
.err{text-align:center;padding:56px 20px;color:#c92a2a;font-size:13px;line-height:1.9}
.foot{text-align:center;color:#94a3b8;font-size:11.5px;padding:28px 0 8px;line-height:2}
.hidden{display:none}
.sk{animation:sk 1.15s ease-in-out infinite}
@keyframes sk{0%,100%{opacity:.55}50%{opacity:1}}
a{color:var(--primary);text-decoration:none}
#toTop{position:fixed;right:22px;bottom:56px;width:40px;height:40px;border-radius:50%;background:linear-gradient(145deg,#3574b8,#245a94);color:#fff;font-size:19px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(43,108,176,.35);opacity:0;pointer-events:none;transition:.22s;z-index:90;border:1px solid rgba(255,255,255,.2)}
#toTop.show{opacity:1;pointer-events:auto}
#toTop:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(43,108,176,.45)}
@media(max-width:760px){
  .brand{padding-right:0}
  .goback{position:static;align-self:center}
  header.top .inner{padding-top:10px;padding-bottom:10px}
}
</style>
</head>
<body>
<header class="top">
  <div class="inner">
    <div class="brand">
      <h1>📡 A股全市场缠论雷达<span class="dot"></span></h1>
      <div class="sub" id="topSub">加载中…</div>
    </div>
    <div class="spacer"></div>
    <a class="goback" href="javascript:toIndex()">← 返回主看板</a>
  </div>
</header>
<div class="wrap">
  <!-- 一级: 行业总览 -->
  <div id="viewHome">
    <!-- 概要条: 仅 5 个核心指标(剔除旧版冗余) -->
    <div class="bar" id="barRow"></div>
    <!-- 行业指数列表: 平铺到顶部 + 专业信息 -->
    <div class="ind-panel">
      <div class="head">
        <h2>行业 · ETF 板块</h2>
        <span class="badge" id="indCnt">…</span>
        <span class="tabs">
          <a id="tabSig" onclick="sortInds('sig')">📊 信号优先</a>
          <a id="tabCap" onclick="sortInds('cap')">💰 市值优先</a>
          <a id="tabChg" onclick="sortInds('chg')">⚡ 涨跌极端</a>
          <a id="tabRel" onclick="sortInds('rel')">🎯 跑赢沪优先</a>
          <a id="tabRsi" class="on" onclick="sortInds('rsi')">📈 RSI 超买优先</a>
        </span>
        <span class="hint">申万一级 31 行业 + ETF 板块 · 默认收折叠起，点击展开</span>
      </div>
      <div class="ind-grid">
        <div>板块</div><div class="ta-r">市值/规模·成分</div><div>走势状态</div>
        <div>近120日走势</div><div class="ta-r">涨跌</div><div class="ta-r">RSI·振幅·门禁</div><div></div>
      </div>
      <div id="indList"><div class="loading sk">行业加载中…</div></div>
    </div>
    <div id="indDetail"></div>
    <div class="foot">数据源：标的池/市值 东财行情 · K线 腾讯前复权(主)/新浪日K(备) · 行业K线=成分股总市值加权合成 · 缠论=自研分笔中枢背驰引擎<br>⚠️ 仅供研究参考，不构成投资建议。页宽与主看板一致(1160px)。</div>
  </div>
  <!-- 二级: 行业详情 -->
  <div id="viewInd" class="hidden"></div>
  <!-- 三级: 个股详情 -->
  <div id="viewStk" class="hidden"></div>
</div>
<a id="toTop" href="javascript:void(0)" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="回到顶部">↑</a>
<script src="vendor/echarts.min.js"></script>
<script>
/* ============================================================
   全市场缠论雷达 v3 · 行业为根 + 个股K线内嵌切换
   数据: radar/radar.json (scan_radar.py P3b-r1) · 前端 R252+R253 · R253-hotfix: 修 drawChart 不清 loading 残留 + legend 重复声明
   K线: 行业=radar.json 内嵌合成; 个股=腾讯 fqkline (CORS 已开)
   ============================================================ */
var UP="#e54545", DN="#18a058", ACC="#2b6cb0";
var M=null, UNI={}, SIG=[], INDS={};
var curInd=null, curStk=null, curTab="ind", myChart=null;
var IDX=null, detailOpen=false;   // IDX=上证基准(close/chg) · detailOpen=行业详情是否已展开
function $(id){return document.getElementById(id)}
function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function pct(v,d){if(v==null||isNaN(v))return "-";return (v>0?"+":"")+(v*100).toFixed(d==null?2:d)+"%"}
function fmtVol(v){if(v==null||isNaN(v))return "-";if(v>=1e8)return (v/1e8).toFixed(2)+"亿手";if(v>=1e4)return (v/1e4).toFixed(0)+"万手";return v.toFixed(0)+"手"}
function capStr(y){if(y==null)return "-";if(y>=1e8)return (y/1e8).toFixed(0)+"亿";if(y>=1e4)return (y/1e4).toFixed(1)+"万";return y}
function regimeCls(r){if(!r)return "flat";if(r.indexOf("顶")>=0)return "top";if(r.indexOf("底")>=0)return "bot";if(r.indexOf("涨")>=0)return "up";if(r.indexOf("跌")>=0)return "dn";return "flat"}
var qs=(location.hash||"").replace(/^#\/?/,"");
fetch("radar.json").then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(function(d){

/* ===== 上证基准(相对强弱对照) ===== */
function idxParse(j){
  var o=(j.data||{})["sh000001"]||{};var arr=o.qfqday||o.day||[];
  if(arr.length<2)return null;
  var c1=+arr[arr.length-1][2],c0=+arr[arr.length-2][2];
  if(!c1||!c0)return null;
  return {close:c1,chg:c1/c0-1,date:arr[arr.length-1][0]};
}
function kickIndex(){
  var urls=["https://ifzq.gtimg.cn/appstock/app/fqkline/get?param=sh000001,day,,,8,qfq",
            "https://ifzq.gtimg.cn/appstock/app/fqkline/get?param=sh000001,day,,,8,"];
  var tryNext=function(list){
    if(!list.length)return;
    fetch(list[0]).then(function(r){return r.json()}).then(function(j){
      var v=idxParse(j);
      if(!v){tryNext(list.slice(1));return;}
      IDX=v;renderBar();renderInds();
      var dw=$("dstripWrap");if(dw&&curInd&&INDS[curInd])dw.innerHTML=detailStrip(INDS[curInd],curInd);
    }).catch(function(){tryNext(list.slice(1));});
  };
  tryNext(urls);
}

  $("indCnt").textContent=(m.n_ind||0)+"+1";
  document.title="A股全市场缠论雷达 · "+(m.asof||"");
}
function renderBar(){
  var m=M||{},scen=m.scen_cnt||{};
  // 横截面温度: 剔除 ETF 合成板块后, 统计全市场超买/超卖行业数
  var ob=0,os=0;
  Object.keys(INDS).forEach(function(k){var x=INDS[k];if(x.is_etf)return;if(x.rsi14==null)return;if(x.rsi14>=70)ob++;else if(x.rsi14<=30)os++;});
  var idxV=IDX?'<b class="'+(IDX.chg>=0?"up":"down")+'">'+IDX.close.toFixed(1)+'</b> <span class="'+(IDX.chg>=0?"up":"down")+'">'+pct(IDX.chg,2)+'</span>':'<span class="idx-ld">加载中…</span>';
  var pills=[
    {l:"上证指数 · 强弱基准",v:idxV},
    {l:"超买行业(RSI≥70)",v:ob,c:ob>0?"hot":""},
    {l:"超卖行业(RSI≤30)",v:os,c:os>0?"cool":""},
    {l:"覆盖标的",v:(m.n_ok||0),c:""},
    {l:"门禁剔除",v:(m.n_gate||0),c:""},
    {l:"今日顶背驰(风险)",v:(scen["背驰见顶风险"]||0),c:"hot"},
    {l:"今日底背驰(机会)",v:(scen["背驰见底机会"]||0),c:"cool"},
  ];
  $("barRow").innerHTML=pills.map(function(p){
    return '<div class="pill '+(p.c||"")+'"><div class="l">'+esc(p.l)+'</div><div class="v">'+p.v+'</div></div>';
  }).join("");
}
/* ===== 行业列表排序 ===== */
function sortInds(mode){
  curSortMode=mode;
  ["tabSig","tabCap","tabChg","tabRel","tabRsi"].forEach(function(id){$(id).classList.remove("on")});
  $("tab"+mode.charAt(0).toUpperCase()+mode.slice(1)).classList.add("on");
  renderInds();
}
var curSortMode="rsi";
function indScore(mode,k){
  var x=INDS[k];if(!x)return 0;
  if(mode==="sig")return (x.n_sig_top||0)*10+(x.n_sig_bot||0)*5+((x.st&&x.st.agree)||0);
  if(mode==="cap")return x.cap||0;
  if(mode==="chg")return Math.abs(x.chg1d||0);
  if(mode==="rel")return IDX?(x.chg1d-(IDX.chg||0)):(x.chg1d||0);   // 相对强弱: 跑赢上证最多者在前
  if(mode==="rsi")return x.rsi14!=null?x.rsi14:-1;   // 超买超卖值从大到小(降序): RSI 高(超买)在前
  return 0;
}
/* ===== 行业迷你SVG ===== */
function sparkSVG(d,w,h){
  if(!d||d.length<2)return '<svg width="'+w+'" height="'+h+'"></svg>';
  var cs=d.map(function(k){return k[3]}),min=Math.min.apply(0,cs),max=Math.max.apply(0,cs),rng=(max-min)||1;
  var X=function(i){return 2+(w-4)*i/(d.length-1)},Y=function(v){return 2+(h-4)*(max-v)/rng};
  var up=cs[cs.length-1]>=cs[0],col=up?UP:DN;
  var pts=cs.map(function(v,i){return X(i).toFixed(1)+","+Y(v).toFixed(1)}).join(" ");
  // MA5(5日均价): 前4点空,从第4点起画紫色虚线
  var maPts=[];
  for(var i=4;i<cs.length;i++){
    var s=0;for(var j=i-4;j<=i;j++)s+=cs[j];
    maPts.push(X(i).toFixed(1)+","+Y(s/5).toFixed(1));
  }
  var maLine=maPts.length?'<polyline points="'+maPts.join(" ")+'" fill="none" stroke="#7f77dd" stroke-width="1.2" stroke-dasharray="3,2"/>':'';
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg">'+
    '<polyline points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="1.6" stroke-linejoin="round"/>'+
    maLine+
    '</svg>';
}
/* RSI 近60日分位: 用行业 kline(320根) 算近60个 RSI, 当前 RSI 所处百分位 */
function rsiPctileOf(ind){
  var kl=ind.kline;if(!kl||kl.length<20||ind.rsi14==null)return null;
  var seq=rsiSeries(kl,14).filter(function(v){return v!=null});
  if(seq.length<20)return null;
  var win=seq.slice(-60);
  var cur=ind.rsi14;
  var below=0;win.forEach(function(v){if(v<=cur)below++});
  return Math.round(below/win.length*100);
}
/* RSI 温度条: 绿(超卖)→灰→红(超买) 渐变, 黑色游标指当前值 */
function rsiBarHtml(rv){
  if(rv==null)return"";
  var p=Math.max(0,Math.min(100,rv)).toFixed(0);
  return '<div class="rsi-bar" style="background:linear-gradient(90deg,#18a058 0%,#b8e6d0 30%,#eef1f5 50%,#f6d0d0 70%,#e54545 100%)">'+
    '<i style="left:calc('+p+'% - 1px)"></i></div>';
}
/* RSI 单元格块: 彩色徽章 + 温度条 + 60日分位/振幅/门禁率 */
function ctrBlock(x){
  var rv=x.rsi14;
  var rsiTxt=rv!=null?rv.toFixed(0):"-";
  var rsiCls=rv==null?"":(rv>=70?"hot":(rv<=30?"cold":"mid"));
  var pp=rsiPctileOf(x);
  var ampTxt=(x.amp20!=null?x.amp20.toFixed(1)+"%":"-");
  var qrtTxt=(x.qual_rate!=null?x.qual_rate.toFixed(0)+"%":"-");
  return '<div class="ctr-top">'+
    '<span class="rsi-cell '+rsiCls+'">RSI '+rsiTxt+'</span>'+rsiBarHtml(rv)+'</div>'+
    '<div class="ctr-sub">'+
    (pp==null?"60日-":"60日"+pp+"%分位")+' · 振'+ampTxt+' · 门禁'+qrtTxt+'</div>';
}
/* ===== 板块异动统计(大涨≥5%/大跌≤-5%, 领涨/领跌; 缓存) ===== */
var MOV={};
function indMovers(k){
  if(MOV[k])return MOV[k];
  var isETF=(INDS[k]||{}).is_etf===1;
  var m={up:0,down:0,top:null,bot:null};
  Object.keys(UNI).forEach(function(sym){
    var u=UNI[sym];if(u.gate)return;
    if(!(isETF?(u.type==="ETF"):(u.ind===k)))return;
    var c=(u.st||{}).chg1d;if(c==null)return;
    if(c>=0.05){m.up++;if(!m.top||c>m.top.chg)m.top={name:u.name,chg:c};}
    else if(c<=-0.05){m.down++;if(!m.bot||c<m.bot.chg)m.bot={name:u.name,chg:c};}
  });
  MOV[k]=m;return m;
}
function ldName(s){s=s||"";return s.length>6?s.slice(0,6)+"…":s}
/* ===== 行业详情头部专业指标带(点开行业即见完整面板) ===== */
function detailStrip(ind,k){
  var rv=ind.rsi14,pp=rsiPctileOf(ind);
  var capTxt=(ind.cap==null)?"-":(ind.cap>=10000?(ind.cap/10000).toFixed(2)+"万亿":ind.cap.toFixed(0)+"亿");
  var stx=ind.st||{};
  var h='<span class="rsi-cell '+(rv==null?"mid":(rv>=70?"hot":(rv<=30?"cold":"mid")))+'">RSI '+(rv!=null?rv.toFixed(0):"-")+'</span>';
  h+='<span>'+rsiBarHtml(rv)+'</span>';
  h+='<span>60日'+(pp==null?"分位 -":pp+"% 分位")+'</span>';
  h+='<span>20日振幅 '+(ind.amp20!=null?ind.amp20.toFixed(1)+"%":"-")+'</span>';
  h+='<span>门禁通过 '+(ind.qual_rate!=null?ind.qual_rate.toFixed(0)+"%":"-")+'</span>';
  h+='<span class="bc">顶背驰 <b class="up">'+(ind.n_sig_top||0)+'</b><span class="dsep">/</span>底背驰 <b class="down">'+(ind.n_sig_bot||0)+'</b></span>';
  h+='<span>'+(ind.is_etf?"总规模 ":"总市值 ")+capTxt+'</span>';
  h+='<span>指数 '+pct(ind.chg1d,2)+'</span>';
  h+='<span>缠论 <b>笔 '+(stx.bi_n||0)+'</b><span class="dsep">·</span><b>中枢 '+(stx.zs_n||0)+'</b><span class="dsep">·</span><b>背驰 '+(stx.bc_n||0)+'</b></span>';
  if(stx.first)h+='<span class="muted">区间 '+esc(stx.first)+'~'+esc(stx.last||"")+'</span>';
  if(IDX){var rel=(ind.chg1d-IDX.chg)*100;h+='<span class="'+(rel>=0?"up":"down")+'">'+(rel>=0?"▲ 跑赢":"▼ 跑输")+'上证 '+Math.abs(rel).toFixed(1)+'pp</span>';}
  var mv=k?indMovers(k):null;
  if(mv&&(mv.top||mv.bot)){
    h+='<span class="dld">';
    if(mv.top)h+='<span class="up" title="板块内今日涨幅最大">领涨 <b class="ld-name">'+esc(ldName(mv.top.name))+'</b> '+pct(mv.top.chg,1)+'</span>';
    if(mv.bot)h+='<span class="down" title="板块内今日跌幅最大">领跌 <b class="ld-name">'+esc(ldName(mv.bot.name))+'</b> '+pct(mv.bot.chg,1)+'</span>';
    h+='</span>';
  }
  return '<div class="dstrip">'+h+'</div>';
}
/* ===== 一级: 行业列表(平铺+专业信息, 折叠) ===== */
var IND_SHOW=8;                 // 折叠态默认展示行数(P3b 减少铺开)
var indExpanded=false;          // true=全部展开
function toggleInds(){indExpanded=!indExpanded;renderInds()}
function renderInds(){
  var keys=Object.keys(INDS).slice().sort(function(a,b){
    return indScore(curSortMode,b)-indScore(curSortMode,a);  // 统一降序(极端度大者在前)
  });
  var html="";
  keys.forEach(function(k,i){
    var x=INDS[k];
    var sg=(x.n_sig_top||0)+(x.n_sig_bot||0);
    var hl = curInd===k?" hl":"";
    var rCls=regimeCls(x.regime);
    var etfTag=x.is_etf?'<span class="badge2 o" style="margin-left:4px">ETF</span>':'';
    var capLbl=x.is_etf?"规模":"市值";
    var capTxt=(x.cap==null)?"-":(x.cap>=10000?(x.cap/10000).toFixed(2)+"万亿":x.cap.toFixed(0)+"亿");
    // 强信号行业: 顶信号>=2 红色左侧条 / 底信号>=2 绿色左侧条
    var strongCls="";
    if((x.n_sig_top||0)>=2)strongCls=" strong-top";
    else if((x.n_sig_bot||0)>=2)strongCls=" strong-bot";
    if(!indExpanded&&i>=IND_SHOW&&!hl)return;   // 折叠: 高亮行业恒显示
    var mv=indMovers(k);   // 板块异动(涨跌≥5%家数) — 仅在显示行计算, MOV 缓存
    var mvLine=(mv.up||mv.down)?'<span class="mvmini">'+(mv.up?'<span class="up">▲'+mv.up+'</span>':'')+(mv.up&&mv.down?' ': '')+(mv.down?'<span class="down">▼'+mv.down+'</span>':'')+' ≥5%</span>':'';
    html+='<div class="ind-row'+hl+strongCls+'" onclick="pickInd(\''+esc(k)+'\')">'+
      '<div class="nm">'+esc(k)+etfTag+(sg?' <span class="badge2 '+(x.n_sig_top?'r':'g')+'">'+(x.n_sig_top?'顶'+x.n_sig_top:'底'+x.n_sig_bot)+'</span>':'')+'</div>'+
      '<div class="meta ta-r">'+capTxt+'<br><span>'+(x.is_etf?(x.n_member||0)+"/"+(x.n_total||0)+"只":(x.n_member||0)+"只")+'</span>'+(mvLine?'<br>'+mvLine:'')+'</div>'+
      '<div><span class="regime '+rCls+'">'+esc(x.regime||"-")+'</span></div>'+
      '<div class="spark">'+sparkSVG(x.spark,160,34)+'</div>'+
      '<div class="chg '+(x.chg1d>0?"up":(x.chg1d<0?"down":""))+'">'+pct(x.chg1d,1)+
      (IDX?'<div class="vsub '+(x.chg1d>=IDX.chg?"up":"down")+'">'+(x.chg1d>=IDX.chg?"强":"弱")+'于沪 '+Math.abs((x.chg1d-IDX.chg)*100).toFixed(1)+'pp</div>':'')+'</div>'+
      '<div class="ctr">'+ctrBlock(x)+'</div>'+
      '<div class="arrow">›</div></div>';
  });
  if(!keys.length){html='<div class="loading">暂无行业数据</div>';}
  $("indList").innerHTML=html;
  // 折叠/展开按钮
  if(keys.length>IND_SHOW){
    var shown=indExpanded?keys.length:Math.max(IND_SHOW,1);
    var more='<div class="more"><a onclick="toggleInds()">'+(indExpanded?'▲ 收起':'▼ 展开其余 '+(keys.length-shown)+' 个板块')+'</a></div>';
    $("indList").insertAdjacentHTML("beforeend",more);
  }
  // 详情已展开时保留 indDetail, 避免排序/折叠/大盘刷新时把面板清掉
  if(!(detailOpen&&curInd)){
    $("indDetail").innerHTML='<div class="empty"><div class="eic">📈</div><div class="etx">点击上方任意板块，查看总K线 + 缠论结构 + 成分列表</div></div>';
  }
}
/* ===== 二级: 行业详情(顶部tab: 行业 / 个股) ===== */

  if(!curStk){curTab="ind";}

  var capTxt=(ind.cap==null)?"-":(ind.cap>=10000?(ind.cap/10000).toFixed(2)+"万亿":ind.cap.toFixed(0)+"亿");
  var grpLbl=ind.is_etf?"场内ETF/LOF 合成板块":"申万一级行业";

      '<span class="regime '+regimeCls(ind.regime)+'">'+esc(ind.regime||"-")+'</span>'+
      '<div class="det-tabs">'+
        '<a id="tInd" class="ind-tab '+(curTab==="ind"?"on":"")+'" onclick="switchTab(\'ind\')">📊 行业 K 线</a>'+
        '<a id="tStk" class="ind-tab '+(curTab==="stk"?"on":"")+'" onclick="switchTab(\'stk\')">📈 个股 K 线'+(curStk?(" · "+esc((UNI[curStk]||{}).name||curStk)):"")+'</a>'+
      '</div>'+
    '</div>'+
    '<div id="dstripWrap">'+detailStrip(ind,k)+'</div>'+
    '<div class="chart-note"><span class="legend-tag"><i style="background:#e54545"></i>涨</span><span class="legend-tag"><i style="background:#18a058"></i>跌</span><span class="legend-tag"><i style="background:#7f77dd"></i>笔</span><span class="legend-tag"><i style="background:rgba(127,119,221,.25)"></i>中枢</span><span class="legend-tag"><i style="background:#c92a2a"></i>顶背驰(红▼)</span><span class="legend-tag"><i style="background:#087f5b"></i>底背驰(绿▲)</span></div>'+
    '<div id="mainChart"><div class="loading sk">K线渲染中…</div></div>'+
    '</div>';
  html+='<div class="sec-t">'+(ind.is_etf?"成分基金":"成分股")+' <span class="cnt">'+k+' · 通过门禁成分(共 '+(ind.n_member||0)+') · 点击任意一行 → 主图K线即时切换(不跳页)</span></div>'+
    '<div id="indStkList" class="panel stk-panel"><div class="loading sk">加载中…</div></div>';
  $("indDetail").innerHTML=html;
  detailOpen=true;
  drawChart();
  renderIndStkList(k);
  // 滚动到详情区顶部(避开吸顶header, 解决"第一行被挡住")
  var dp=$("indDetailPanel");
  setTimeout(function(){if(dp)dp.scrollIntoView({behavior:"smooth",block:"start"})},60);
}
function switchTab(tab){

  var tI=$("tInd"),tS=$("tStk");
  if(tI)tI.className="ind-tab "+(tab==="ind"?"on":"");
  if(tS)tS.className="ind-tab "+(tab==="stk"?"on":"");

/* 行业 K 线 vs 个股 K 线(同一 mainChart, 切换数据源) */
function drawChart(){
  var el=$("mainChart");if(!el)return;
  if(curTab==="stk"&&curStk){
    drawStkInto(el,curStk);
    return;
  }
  if(curTab!=="ind"||!curInd){el.innerHTML='<div class="loading" style="padding:60px 0">点击下方股票查看个股K线</div>';return;}
  var ind=INDS[curInd],kl=ind.kline||[];
  if(!kl.length){el.innerHTML='<div class="err">该行业合成K线为空</div>';return;}
  // [R253 bug fix] 关键: 行业主路径此前不清 el.innerHTML,
  // 上一次残留的 <div class="loading sk">K线渲染中…</div> 会卡死 mainChart.
  // echarts.init(zrender) 不会清空 DOM 子节点,只追加 svg,loading 文字盖在 svg 上.
  el.innerHTML="";
  var opt=indKlineOption(kl);
  opt.series=opt.series.concat(chanMarkOption(ind.mark,kl.map(function(x){return x.date})));
  // legend 只 push 实际存在的系列,避免 "底背驰" 等 0 信号行业报 warning
  ["笔","顶背驰","底背驰"].forEach(function(n){

/* Wilder 平滑 RSI(14) 全序列(与 scan_radar._rsi14 同算法), 前 n 根 null */
function rsiSeries(kl,n){
  n=n||14;
  var cs=kl.map(function(k){return +k.close});
  var out=new Array(cs.length).fill(null);
  if(cs.length<n+1)return out;
  var gains=[],losses=[];
  for(var i=1;i<cs.length;i++){var d=cs[i]-cs[i-1];gains.push(d>0?d:0);losses.push(d<0?-d:0);}
  var ag=0,al=0;
  for(var j=0;j<n;j++){ag+=gains[j];al+=losses[j];}
  ag/=n;al/=n;
  out[n]=al<=0?100:(100-100/(1+ag/al));
  for(var i=n;i<gains.length;i++){
    ag=(ag*(n-1)+gains[i])/n;al=(al*(n-1)+losses[i])/n;
    out[i+1]=al<=0?100:(100-100/(1+ag/al));
  }
  return out;
}
function indKlineOption(kl){
  var dates=kl.map(function(k){return k.date});

  var vols=kl.map(function(k){var up=k.close>=k.open;return {value:k.volume,itemStyle:{color:up?UP:DN,opacity:.75}}});
  var ma=function(n,col){var r=[];for(var i=0;i<kl.length;i++){if(i<n-1){r.push("-");continue}var s=0;for(var j=i-n+1;j<=i;j++)s+=kl[j].close;r.push(+(s/n).toFixed(2))}return {name:"MA"+n,type:"line",data:r,smooth:false,symbol:"none",lineStyle:{width:1,color:col}}};
  var rsiRaw=rsiSeries(kl,14);
  var rsiData=rsiRaw.map(function(v){return v==null?"-":(+v.toFixed(1))});
  return {
    animation:false,backgroundColor:"#fff",
    tooltip:{trigger:"axis",axisPointer:{type:"cross",label:{fontSize:11}},backgroundColor:"rgba(15,23,42,.92)",textStyle:{fontSize:12,lineHeight:20},borderWidth:0,padding:[8,12],
      extraCssText:"border-radius:10px;box-shadow:0 8px 24px rgba(15,23,42,.28);font-variant-numeric:tabular-nums;",
      formatter:function(ps){var p=ps[0];if(!p||!p.axisValue)return"";var i=ps[0].dataIndex;var k=kl[i];if(!k)return p.axisValue;
        var up=k.close>=k.open;
        return "<div style='font-size:12px;font-weight:700;margin-bottom:3px'>"+k.date+"</div>"+
          "开 "+k.open+"　收 <b style='color:"+(up?"#ff6b6b":"#4ade80")+"'>"+k.close+"</b>"+(up?" ▲":" ▼")+
          "<br/>高 "+k.high+"　低 "+k.low+(rsiRaw[i]!=null?"<br/>RSI14 <b style='color:#b39ddb'>"+(+rsiRaw[i].toFixed(1))+"</b>":"")+

function chanMarkOption(mark,dates){
  var ser=[];
  if(!mark)return ser;
  var di={};dates.forEach(function(d,i){di[d]=i});
  function xi(dt){return di[dt]!=null?di[dt]:null}
  if(mark.line&&mark.line.length){
    var data=[];
    mark.line.forEach(function(b){var x1=xi(b[0]),x2=xi(b[2]);if(x1==null||x2==null)return;data.push([x1,b[1]],[x2,b[3]]);});
    if(data.length)ser.push({name:"笔",type:"line",data:data,symbol:"none",lineStyle:{width:1,color:"#7f77dd"},z:2,clip:true});
  }
  if(mark.zs&&mark.zs.length){
    var areas=[];
    mark.zs.forEach(function(z){var x1=xi(z[2]),x2=xi(z[3]);if(x1==null||x2==null)return;areas.push([{name:"中枢",xAxis:x1,yAxis:z[1],itemStyle:{color:"rgba(127,119,221,.16)",borderColor:"#7f77dd",borderWidth:.8}},{xAxis:x2,yAxis:z[0]}]);});
    if(areas.length)ser.push({name:"中枢",type:"line",data:[],markArea:{silent:true,itemStyle:{color:"transparent"},data:areas}});
  }
  var tp=[],bp=[];
  (mark.bc||[]).forEach(function(b){var x=xi(b[1]);if(x==null)return;var isTop=b[0]==="top"||b[0]===1||String(b[0]).indexOf("顶")>=0;(isTop?tp:bp).push({value:[x,b[2]]});});
  function sc(col,dir){return {name:dir,type:"scatter",data:dir==="顶背驰"?tp:bp,symbol:"triangle",symbolSize:12,symbolRotate:dir==="顶背驰"?180:0,itemStyle:{color:col,borderColor:"#fff",borderWidth:1},z:6,label:{show:true,formatter:dir,fontSize:9,position:dir==="顶背驰"?"top":"bottom",color:col,fontWeight:"700"}}}
  if(tp.length)ser.push(sc("#c92a2a","顶背驰"));
  if(bp.length)ser.push(sc("#087f5b","底背驰"));
  return ser;
}

  var h=(location.hash||"").replace(/^#\/?/,"");
  if(h.indexOf("stk/")===0){var s=decodeURIComponent(h.slice(4));if(curStk!==s||curTab!=="stk"){curStk=s;curTab="stk";}}
  else if(h.indexOf("ind/")===0){var k=decodeURIComponent(h.slice(4));if(curInd!==k)pickInd(k);}
  else if(!h)backHome();
});
