<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A股全市场缠论雷达 · 行业总览</title>
<style>
:root{
  --primary:#2b6cb0; --primary2:#60a5fa; --ink:#1f2937; --muted:#64748b;
  --border:#e2e8f0; --bg:#f5f7fa; --card:#fff;
  --up:#e54545; --down:#18a058;   /* A股约定: 涨红 跌绿 */
  --grad:linear-gradient(120deg,#0f172a 0%,#1e3a5f 52%,#2b6cb0 100%);
  --radius:14px; --shadow:0 1px 3px rgba(15,23,42,.05);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.wrap{max-width:1160px;margin:0 auto;padding:18px 18px 40px}
/* ===== 顶部(与主看板同款深蓝渐变) ===== */
header.top{position:sticky;top:0;z-index:50;background:var(--grad);color:#fff;box-shadow:0 2px 12px rgba(15,23,42,.25)}
header.top .inner{max-width:1160px;margin:0 auto;padding:14px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column}
h1{font-size:20px;font-weight:700;letter-spacing:.5px}
h1 .dot{color:#ffd43b}
.sub{color:#c8d3e2;font-size:12px;margin-top:3px}
.sub b{color:#fff}
.spacer{flex:1}
.goback{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;padding:7px 14px;border-radius:999px;font-size:13px;cursor:pointer;text-decoration:none;transition:.15s;white-space:nowrap}
.goback:hover{background:rgba(255,255,255,.26)}
/* ===== 概要条 ===== */
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.bar .pill{flex:1 1 0;min-width:110px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:8px 12px;box-shadow:var(--shadow)}
.bar .pill .l{font-size:11px;color:var(--muted)}
.bar .pill .v{font-size:16px;font-weight:700;color:var(--ink);margin-top:2px}
.bar .pill.hot .v{color:#c77700}
.bar .pill.cool .v{color:#087f5b}
/* ===== 行业列表(平铺 + 专业信息) ===== */
.ind-panel{margin-top:14px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.ind-panel .head{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid #eef2f7;flex-wrap:wrap}
.ind-panel .head h2{font-size:15px;font-weight:700}
.ind-panel .head .badge{background:var(--primary);color:#fff;font-size:11px;border-radius:20px;padding:1px 9px;font-weight:600}
.ind-panel .head .hint{font-size:12px;color:var(--muted);margin-left:auto}
.ind-panel .head .tabs{display:flex;gap:4px;background:#f1f5f9;border-radius:8px;padding:2px}
.ind-panel .head .tabs a{font-size:12px;padding:4px 10px;border-radius:6px;cursor:pointer;color:var(--muted);text-decoration:none}
.ind-panel .head .tabs a.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.ind-grid{display:grid;grid-template-columns:1.4fr .8fr .8fr 1.5fr .7fr .7fr 26px;gap:8px;align-items:center;padding:9px 16px;font-size:11px;background:#f8fafc;color:var(--muted);border-bottom:1px solid #eef2f7;border-top:1px solid #eef2f7;position:sticky;top:56px;z-index:5}
.ind-row{display:grid;grid-template-columns:1.4fr .8fr .8fr 1.5fr .7fr .7fr 26px;gap:8px;align-items:center;padding:10px 16px;border-top:1px solid #f1f5f9;cursor:pointer;transition:.12s}
.ind-row:hover{background:#f8fafc}
.ind-row:first-of-type{border-top:0}
.ind-row.hl{background:#eaf2fb}
.ind-row .nm{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.ind-row .meta{font-size:11px;color:var(--muted);line-height:1.5}
.ind-row .spark{width:100%;height:34px}
.ind-row .chg{font-weight:700;font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.ind-row .ctr{font-size:11px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.ind-row .arrow{color:#cbd5e1;margin-left:2px;text-align:center}
.up{color:var(--up)!important}
.down{color:var(--down)!important}
/* 走势背驰状态标签 */
.regime{display:inline-block;font-size:10px;font-weight:700;border-radius:4px;padding:1px 6px;line-height:1.5}
.regime.top{background:#fdecec;color:#c92a2a}
.regime.bot{background:#e6f9f0;color:#087f5b}
.regime.up{background:#fef3c7;color:#92400e}
.regime.dn{background:#e0f2fe;color:#075985}
.regime.flat{background:#eef2f8;color:#64748b}
/* 行业详情(K线/成分股) */
#indDetail{margin-top:14px}
.chart-note{font-size:11px;color:var(--muted);padding:6px 16px 8px;line-height:1.7}
.legend-tag{display:inline-block;font-size:11px;margin-right:14px;color:var(--muted)}
.legend-tag i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
#mainChart{width:100%;height:560px}
.mini-chart{width:100%;height:300px}
/* ===== 表格(成分股信号列表) ===== */
.sec-t{display:flex;align-items:center;gap:8px;padding:14px 16px 0;font-size:15px;font-weight:700}
.sec-t .cnt{font-size:12px;color:var(--muted);font-weight:400}
.stk-grid{display:grid;grid-template-columns:minmax(170px,1.3fr) repeat(7,minmax(52px,.7fr)) 22px;gap:6px;align-items:center;padding:9px 16px;font-size:12px;border-top:1px solid #f1f5f9;cursor:pointer;transition:.12s}
.stk-grid:hover{background:#f8fafc}
.stk-grid.head{background:#f8fafc;color:var(--muted);font-size:11px;cursor:default;border-top:0;position:sticky;top:56px;z-index:5}
.stk-grid .nm{font-weight:700;color:var(--ink);font-size:13px}
.stk-grid .cd{color:var(--muted);font-size:10px}
.stk-grid .val{text-align:right;font-variant-numeric:tabular-nums}
.stk-grid .vhl{font-weight:700}
.badge2{display:inline-block;font-size:10px;padding:0 6px;border-radius:4px;font-weight:600}
.badge2.r{background:#fdecec;color:#c92a2a}
.badge2.g{background:#e6f9f0;color:#087f5b}
.badge2.y{background:#fff4e0;color:#9a6700}
.badge2.z{background:#eef2f8;color:#64748b}
.badge2.o{background:#e0f2fe;color:#075985}
/* ===== 详情抽屉(个股) ===== */
.subcrumb{font-size:13px;color:var(--muted);padding:14px 16px 0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.subcrumb a{color:var(--primary);text-decoration:none;cursor:pointer}
.subcrumb .arr{color:#cbd5e1}
.big-title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:6px 16px 0}
.big-title h2{font-size:26px;font-weight:800}
.big-title .cd{color:var(--muted);font-size:13px}
.metric-strip{display:flex;flex-wrap:wrap;gap:18px;padding:10px 16px 14px;font-size:13px;color:var(--muted)}
.metric-strip b{font-size:18px;color:var(--ink);margin-right:3px}
.signals-box{padding:0 16px 14px}
.signal-pill{border-radius:10px;padding:10px 14px;font-size:13px;line-height:1.6;margin-bottom:8px}
.signal-pill.t{background:#fdecec;border:1px solid #f5c2c2;color:#8a1f1f}
.signal-pill.b{background:#e6f9f0;border:1px solid #b8e6d3;color:#0c5c3c}
.signal-pill b{font-size:14px}
.gate-pill{background:#f1f5f9;border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;font-size:13px;color:#64748b;margin-bottom:8px}
.gate-pill b{color:#475569}
.chart-sec{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:980px){.chart-sec{grid-template-columns:1fr}}
@media(max-width:980px){.ind-grid,.ind-row{grid-template-columns:1fr .7fr .7fr 1.2fr .6fr .6fr 22px}}
.loading{text-align:center;padding:80px 0;color:var(--muted);font-size:14px}
.err{text-align:center;padding:60px 20px;color:#c92a2a;font-size:13px;line-height:1.8}
.foot{text-align:center;color:#94a3b8;font-size:11px;padding:26px 0 6px;line-height:1.9}
.hidden{display:none}
.sk{animation:sk 1.2s ease-in-out infinite;border-radius:8px}
@keyframes sk{0%,100%{opacity:.5}50%{opacity:1}}
a{color:var(--primary);text-decoration:none}
</style>
</head>
<body>
<header class="top">
  <div class="inner">
    <div class="brand">
      <h1>📡 A股全市场缠论雷达<span class="dot"></span></h1>
      <div class="sub" id="topSub">加载中…</div>
    </div>
    <div class="spacer"></div>
    <a class="goback" href="javascript:toIndex()">← 返回主看板</a>
  </div>
</header>
<div class="wrap">
  <!-- 一级: 行业总览 -->
  <div id="viewHome">
    <!-- 概要条: 仅 5 个核心指标(剔除旧版冗余) -->
    <div class="bar" id="barRow"></div>
    <!-- 行业指数列表: 平铺到顶部 + 专业信息 -->
    <div class="ind-panel">
      <div class="head">
        <h2>行业指数</h2>
        <span class="badge" id="indCnt">…</span>
        <span class="tabs">
          <a id="tabSig" class="on" onclick="sortInds('sig')">📊 信号优先</a>
          <a id="tabCap" onclick="sortInds('cap')">💰 市值优先</a>
          <a id="tabChg" onclick="sortInds('chg')">⚡ 涨跌极端</a>
          <a id="tabRsi" onclick="sortInds('rsi')">📈 RSI 极端</a>
        </span>
        <span class="hint">点击行业查看总K线与成分股·P3 加 4 项专业指标</span>
      </div>
      <div class="ind-grid">
        <div>行业</div><div style="text-align:right">市值·成分</div><div style="text-align:right">走势·状态</div>
        <div>近120日走势</div><div style="text-align:right">涨跌</div><div style="text-align:right">RSI·振幅·门禁</div><div></div>
      </div>
      <div id="indList"><div class="loading sk">行业加载中…</div></div>
    </div>
    <div id="indDetail"></div>
    <div class="foot">数据源：标的池/市值 东财行情 · K线 腾讯前复权(主)/新浪日K(备) · 行业K线=成分股总市值加权合成 · 缠论=自研分笔中枢背驰引擎<br>⚠️ 仅供研究参考，不构成投资建议。页宽与主看板一致(1160px)。</div>
  </div>
  <!-- 二级: 行业详情 -->
  <div id="viewInd" class="hidden"></div>
  <!-- 三级: 个股详情 -->
  <div id="viewStk" class="hidden"></div>
</div>
<script src="vendor/echarts.min.js"></script>
<script>
/* ============================================================
   全市场缠论雷达 v3 · 行业为根 + 个股K线内嵌切换
   数据: radar/radar.json (scan_radar.py P3-r1)
   K线: 行业=radar.json 内嵌合成; 个股=腾讯 fqkline (CORS 已开)
   ============================================================ */
var UP="#e54545", DN="#18a058", ACC="#2b6cb0";
var M=null, UNI={}, SIG=[], INDS={};
var curInd=null, curStk=null, curTab="ind", myChart=null;
function $(id){return document.getElementById(id)}
function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function pct(v,d){if(v==null||isNaN(v))return "-";return (v>0?"+":"")+(v*100).toFixed(d==null?2:d)+"%"}
function capStr(y){if(y==null)return "-";if(y>=1e8)return (y/1e8).toFixed(0)+"亿";if(y>=1e4)return (y/1e4).toFixed(1)+"万";return y}
function regimeCls(r){if(!r)return "flat";if(r.indexOf("顶")>=0)return "top";if(r.indexOf("底")>=0)return "bot";if(r.indexOf("涨")>=0)return "up";if(r.indexOf("跌")>=0)return "dn";return "flat"}
var qs=(location.hash||"").replace(/^#\/?/,"");
fetch("radar.json").then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(function(d){
  M=d.meta;UNI=d.universe||{};SIG=d.signals||[];INDS=d.industries||{};
  renderHeader();renderBar();
  if(qs.indexOf("stk/")===0)showStk(decodeURIComponent(qs.slice(4)));
  else if(qs.indexOf("ind/")===0)pickInd(decodeURIComponent(qs.slice(4)));
  else renderInds();
}).catch(function(e){$("topSub").textContent="数据加载失败";$("indList").innerHTML='<div class="err">无法加载 radar.json：'+esc(e.message)+'<br>请确认已与 radar.json 同目录部署（GitHub Pages / 本地静态服务）。</div>'});

function renderHeader(){
  var m=M||{};
  $("topSub").innerHTML="申万一级 <b>"+(m.n_ind||Object.keys(INDS).length)+"</b> 行业 · 覆盖 <b>"+(m.n_ok||0)+"</b> 只 · 信号 <b>"+(m.n_signal||0)+"</b> · 数据截至 <b>"+(m.asof||"-")+"</b> · "+ (m.build_time||"");
  $("indCnt").textContent=(m.n_ind||0)+" 个";
  document.title="A股全市场缠论雷达 · "+(m.asof||"");
}
function renderBar(){
  var m=M||{},scen=m.scen_cnt||{};
  var pills=[
    {l:"覆盖标的",v:(m.n_ok||0),c:""},
    {l:"门禁剔除",v:(m.n_gate||0),c:""},
    {l:"今日顶背驰(风险)",v:(scen["背驰见顶风险"]||0),c:"hot"},
    {l:"今日底背驰(机会)",v:(scen["背驰见底机会"]||0),c:"cool"},
    {l:"行业合成数",v:Object.keys(INDS).length,c:""},
  ];
  $("barRow").innerHTML=pills.map(function(p){
    return '<div class="pill '+(p.c||"")+'"><div class="l">'+esc(p.l)+'</div><div class="v">'+esc(p.v)+'</div></div>';
  }).join("");
}
/* ===== 行业列表排序 ===== */
function sortInds(mode){
  curSortMode=mode;
  ["tabSig","tabCap","tabChg","tabRsi"].forEach(function(id){$(id).classList.remove("on")});
  $("tab"+mode.charAt(0).toUpperCase()+mode.slice(1)).classList.add("on");
  renderInds();
}
var curSortMode="sig";
function indScore(mode,k){
  var x=INDS[k];if(!x)return 0;
  if(mode==="sig")return (x.n_sig_top||0)*10+(x.n_sig_bot||0)*5+((x.st&&x.st.agree)||0);
  if(mode==="cap")return x.cap||0;
  if(mode==="chg")return Math.abs(x.chg1d||0);
  if(mode==="rsi")return Math.abs((x.rsi14||50)-50);
  return 0;
}
/* ===== 行业迷你SVG ===== */
function sparkSVG(d,w,h){
  if(!d||d.length<2)return '<svg width="'+w+'" height="'+h+'"></svg>';
  var ps=d.map(function(k){return k[3]}),min=Math.min.apply(0,ps),max=Math.max.apply(0,ps),rng=(max-min)||1;
  var X=function(i){return 2+(w-4)*i/(d.length-1)},Y=function(v){return 2+(h-4)*(max-v)/rng};
  var up=d[d.length-1][3]>=d[0][3];
  var col=up?UP:DN;
  var pts=d.map(function(k,i){return X(i).toFixed(1)+","+Y(k[3]).toFixed(1)}).join(" ");
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'"><polyline points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="1.6" stroke-linejoin="round"/></svg>';
}
/* ===== 一级: 行业列表(平铺+专业信息) ===== */
function renderInds(){
  var keys=Object.keys(INDS).slice().sort(function(a,b){
    var s=indScore(curSortMode,b)-indScore(curSortMode,a);
    if(curSortMode==="chg"||curSortMode==="rsi")s=-s;  // 极端度从大到小
    return s;
  });
  var html="";
  keys.forEach(function(k){
    var x=INDS[k];
    var sg=(x.n_sig_top||0)+(x.n_sig_bot||0);
    var hl = curInd===k?" hl":"";
    var rCls=regimeCls(x.regime);
    var rsiTxt=(x.rsi14!=null?x.rsi14.toFixed(0):"-");
    var ampTxt=(x.amp20!=null?x.amp20.toFixed(1)+"%":"-");
    var qrtTxt=(x.qual_rate!=null?x.qual_rate.toFixed(0)+"%":"-");
    html+='<div class="ind-row'+hl+'" onclick="pickInd(\''+esc(k)+'\')">'+
      '<div class="nm">'+esc(k)+(sg?' <span class="badge2 '+(x.n_sig_top?'r':'g')+'">'+(x.n_sig_top?'顶'+x.n_sig_top:'底'+x.n_sig_bot)+'</span>':'')+'</div>'+
      '<div class="meta" style="text-align:right">'+capStr(x.cap)+'<br><span style="color:var(--muted)">'+(x.n_member||0)+'只</span></div>'+
      '<div><span class="regime '+rCls+'">'+esc(x.regime||"-")+'</span></div>'+
      '<div class="spark">'+sparkSVG(x.spark,160,34)+'</div>'+
      '<div class="chg '+(x.chg1d>0?"up":(x.chg1d<0?"down":""))+'">'+pct(x.chg1d,1)+'</div>'+
      '<div class="ctr">RSI '+rsiTxt+' · 振'+ampTxt+'<br>门禁率 '+qrtTxt+'</div>'+
      '<div class="arrow">›</div></div>';
  });
  if(!keys.length){html='<div class="loading">暂无行业数据</div>';}
  $("indList").innerHTML=html;
  $("indDetail").innerHTML='<div class="panel" style="margin-top:14px;padding:60px 20px;text-align:center;color:var(--muted);background:#fff;border:1px solid var(--border);border-radius:14px"><div style="font-size:30px;opacity:.4">📈</div><div style="margin-top:8px">点击上方任意行业，查看该行业总K线 + 缠论结构 + 成分股列表</div></div>';
}
/* ===== 二级: 行业详情(顶部tab: 行业 / 个股) ===== */
function pickInd(k){
  var ind=INDS[k];
  if(!ind){alert("无行业 "+k+" 数据");return}
  curInd=k;
  if(!curStk){curTab="ind";}
  if(("ind/"+k)!==(location.hash||"").replace(/^#\/?/,""))location.hash="#ind/"+encodeURIComponent(k);
  renderInds();
  // 不切换视图: 留在首页, 在 indDetail 渲染
  $("viewHome").classList.remove("hidden");
  $("viewInd").classList.add("hidden");
  $("viewStk").classList.add("hidden");
  var st=ind.st||{};
  var html='<div class="panel" style="margin-top:14px;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:hidden">'+
    '<div style="display:flex;align-items:center;gap:12px;padding:13px 16px;flex-wrap:wrap;border-bottom:1px solid #eef2f7">'+
      '<h2 style="font-size:17px">'+esc(k)+' <span style="color:var(--muted);font-size:13px;font-weight:400">申万一级 · '+capStr(ind.cap)+' · '+(ind.n_member||0)+'成分 · 行业指数'+pct(ind.chg1d,2)+'</span></h2>'+
      '<span class="regime '+regimeCls(ind.regime)+'" style="font-size:11px;padding:2px 8px">'+esc(ind.regime||"-")+'</span>'+
      '<div style="display:flex;gap:6px;background:#f1f5f9;border-radius:8px;padding:2px;margin-left:auto">'+
        '<a id="tInd" class="ind-tab '+(curTab==="ind"?"on":"")+'" onclick="switchTab(\'ind\')" style="font-size:12px;padding:5px 12px;border-radius:6px;cursor:pointer;color:'+(curTab==="ind"?"#1f2937":"#64748b")+';background:'+(curTab==="ind"?"#fff":"transparent")+';font-weight:'+(curTab==="ind"?"700":"400")+'">📊 行业 K 线</a>'+
        '<a id="tStk" class="ind-tab '+(curTab==="stk"?"on":"")+'" onclick="switchTab(\'stk\')" style="font-size:12px;padding:5px 12px;border-radius:6px;cursor:pointer;color:'+(curTab==="stk"?"#1f2937":"#64748b")+';background:'+(curTab==="stk"?"#fff":"transparent")+';font-weight:'+(curTab==="stk"?"700":"400")+'">📈 个股 K 线'+(curStk?(" · "+esc((UNI[curStk]||{}).name||curStk)):"")+'</a>'+
      '</div>'+
    '</div>'+
    '<div class="chart-note"><span class="legend-tag"><i style="background:#e54545"></i>涨</span><span class="legend-tag"><i style="background:#18a058"></i>跌</span><span class="legend-tag"><i style="background:#7f77dd"></i>笔</span><span class="legend-tag"><i style="background:rgba(127,119,221,.25)"></i>中枢</span><span class="legend-tag"><i style="background:#c92a2a"></i>顶背驰(红▼)</span><span class="legend-tag"><i style="background:#087f5b"></i>底背驰(绿▲)</span></div>'+

/* ===== 通用: K线 option + 缠论标注 ===== */
function indKlineOption(kl){
  var dates=kl.map(function(k){return k.date});
  var kdata=kl.map(function(k){return [k.open,k.close,k.low,k.high]});
  var vols=kl.map(function(k){var up=k.close>=k.open;return {value:k.volume,itemStyle:{color:up?UP:DN,opacity:.75}}});
  var ma=function(n,col){var r=[];for(var i=0;i<kl.length;i++){if(i<n-1){r.push("-");continue}var s=0;for(var j=i-n+1;j<=i;j++)s+=kl[j].close;r.push(+(s/n).toFixed(2))}return {name:"MA"+n,type:"line",data:r,smooth:false,symbol:"none",lineStyle:{width:1,color:col}}};
  return {
    animation:false,backgroundColor:"#fff",
    tooltip:{trigger:"axis",axisPointer:{type:"cross"},backgroundColor:"rgba(15,23,42,.9)",textStyle:{fontSize:11},borderWidth:0,
      formatter:function(ps){var p=ps[0];if(!p||!p.axisValue)return"";var i=ps[0].dataIndex;var k=kl[i];if(!k)return p.axisValue;
        var up=k.close>=k.open;return "<b>"+k.date+"</b><br/>开 "+k.open+"　收 "+k.close+(up?" ▲":" ▼")+"<br/>高 "+k.high+"　低 "+k.low;}},
    legend:{data:["K线","MA5","MA10","MA20"],top:6,textStyle:{fontSize:11},itemWidth:14,itemHeight:8},
    axisPointer:{link:[{xAxisIndex:"all"}]},
    grid:[{left:58,right:16,top:34,height:"62%"},{left:58,right:16,top:"76%",height:"15%"}],
    xAxis:[{type:"category",data:dates,boundaryGap:true,axisLine:{lineStyle:{color:"#d7dee8"}},axisLabel:{fontSize:10,color:"#8a94a3"},axisTick:{show:false}},
           {type:"category",gridIndex:1,data:dates,boundaryGap:true,axisLabel:{show:false},axisLine:{lineStyle:{color:"#e8edf4"}}}],
    yAxis:[{scale:true,axisLabel:{fontSize:10,color:"#8a94a3"},splitLine:{lineStyle:{color:"f0f3f8"}}},
           {scale:true,gridIndex:1,axisLabel:{show:false},splitLine:{show:false},axisLine:{show:false},axisTick:{show:false}}],
    dataZoom:[{type:"inside",xAxisIndex:[0,1],start:30,end:100},{type:"slider",xAxisIndex:[0,1],start:30,end:100,height:16,bottom:4,brushSelect:false}],
    series:[
      {name:"K线",type:"candlestick",data:kdata,itemStyle:{color:UP,color0:DN,borderColor:UP,borderColor0:DN},barWidth:"65%"},
      {name:"量",type:"bar",xAxisIndex:1,yAxisIndex:1,data:vols,barWidth:"65%"},
      ma(5,"#f59f00"),ma(10,"#3b82f6"),ma(20,"#a855f7")
    ]
  };
}
function chanMarkOption(mark,dates){
  var ser=[];
  if(!mark)return ser;
  var di={};dates.forEach(function(d,i){di[d]=i});
  function xi(dt){return di[dt]!=null?di[dt]:null}
  if(mark.line&&mark.line.length){
    var data=[];
    mark.line.forEach(function(b){var x1=xi(b[0]),x2=xi(b[2]);if(x1==null||x2==null)return;data.push([x1,b[1]],[x2,b[3]]);});
    if(data.length)ser.push({name:"笔",type:"line",data:data,symbol:"none",lineStyle:{width:1,color:"#7f77dd"},z:2,clip:true});
  }
  if(mark.zs&&mark.zs.length){
    var areas=[];
    mark.zs.forEach(function(z){var x1=xi(z[2]),x2=xi(z[3]);if(x1==null||x2==null)return;areas.push([{name:"中枢",xAxis:x1,yAxis:z[1],itemStyle:{color:"rgba(127,119,221,.16)",borderColor:"#7f77dd",borderWidth:.8}},{xAxis:x2,yAxis:z[0]}]);});
    if(areas.length)ser.push({name:"中枢",type:"line",data:[],markArea:{silent:true,itemStyle:{color:"transparent"},data:areas}});
  }
  var tp=[],bp=[];
  (mark.bc||[]).forEach(function(b){var x=xi(b[1]);if(x==null)return;var isTop=b[0]==="top"||b[0]===1||String(b[0]).indexOf("顶")>=0;(isTop?tp:bp).push({value:[x,b[2]]});});
  function sc(col,dir){return {name:dir,type:"scatter",data:dir==="顶背驰"?tp:bp,symbol:"triangle",symbolSize:12,symbolRotate:dir==="顶背驰"?180:0,itemStyle:{color:col,borderColor:"#fff",borderWidth:1},z:6,label:{show:true,formatter:dir,fontSize:9,position:dir==="顶背驰"?"top":"bottom",color:col,fontWeight:"700"}}}
  if(tp.length)ser.push(sc("#c92a2a","顶背驰"));
  if(bp.length)ser.push(sc("#087f5b","底背驰"));
  return ser;
}
/* ===== 路由 ===== */
window.addEventListener("hashchange",function(){
  var h=(location.hash||"").replace(/^#\/?/,"");
  if(h.indexOf("stk/")===0){var s=decodeURIComponent(h.slice(4));if(curStk!==s||curTab!=="stk"){curStk=s;curTab="stk";}}
  else if(h.indexOf("ind/")===0){var k=decodeURIComponent(h.slice(4));if(curInd!==k)pickInd(k);}
  else if(!h)backHome();
});
window.addEventListener("resize",function(){if(myChart)myChart.resize()});
</script>
